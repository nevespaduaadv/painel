<!-- Código personalizado do Elementor (Custom Code "Neves Pádua — formulário → sistema", local: fim do body).
     Repassa cada envio válido do formulário do site (o submit é interceptado pelo script da migração, que abre o WhatsApp) para a Edge Function do sistema interno,
     rota /functions/v1/chatguru/site (migração 0069). Honeypot + tempo de preenchimento vão junto para a triagem. -->
<script id="np-site-lead">
(() => {
  'use strict';
  const DESTINO = 'https://ksdwzljfjfucjevdqxvx.supabase.co/functions/v1/chatguru/site';
  const t0 = Date.now();
  const preparar = (form) => {
    if (form.dataset.npLead) return;
    form.dataset.npLead = '1';
    // campo armadilha: visitante não vê; robô preenche
    const hp = document.createElement('input');
    hp.type = 'text'; hp.name = 'site_web'; hp.autocomplete = 'off'; hp.tabIndex = -1;
    hp.setAttribute('aria-hidden', 'true');
    hp.style.cssText = 'position:absolute!important;left:-9999px!important;width:1px;height:1px;opacity:0';
    form.appendChild(hp);
    const valor = (n) => { const el = form.querySelector('[name="' + n + '"]'); if (!el) return ''; return el.type === 'checkbox' ? (el.checked ? 'sim' : '') : String(el.value || '').trim(); };
    const coletar = () => ({ nome: valor('nome'), telefone: valor('telefone'), email: valor('email'), empresa: valor('empresa'), valorDivida: valor('valorDivida'), situacaoDivida: valor('situacaoDivida'), area: valor('area'), mensagem: valor('mensagem') || valor('descricaoSituacao'), consentimento: valor('consentimento'), hp: hp.value, t: Date.now() - t0, pagina: location.pathname });
    // O script da migração intercepta o submit (abre o WhatsApp com os dados), então o envio ao sistema
    // acontece no próprio submit, em fase de captura, assim que o formulário passa na validação do navegador.
    let ultimo = 0;
    form.addEventListener('submit', () => {
      if (!form.checkValidity() || Date.now() - ultimo < 15000) return;
      ultimo = Date.now();
      fetch(DESTINO, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(coletar()), keepalive: true }).catch(() => {});
    }, true);
  };
  document.querySelectorAll('form[data-element_type="e-form"]').forEach(preparar);
})();
</script>
