<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clientes — Neves Pádua Advocacia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: lista de clientes à esquerda, painel do cliente à direita; stack em telas estreitas. */
:root{
  --navy:#0C1F38; --gold:#B8964A; --gold-soft:#E7DCC2;
  --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#EFEBE2; --line:#D9D3C6;
  --fg:#1B2433; --muted:#5E6878; --faint:#8A93A3;
  --ok:#2E7D5B; --warn:#B8860B; --crit:#A23B3B; --info:#2F5C8F;
  --ch-a:#2E5FA3; --ch-b:#B07A1C; --ch-grid:#E4DFD3;
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1626; --surface:#122238; --surface-2:#182C47; --line:#27405F;
  --fg:#E9E4D8; --muted:#A9B2C2; --faint:#7D889B; --gold-soft:#3E3522;
  --ok:#5BB38A; --warn:#D9B04A; --crit:#D8706B; --info:#7FA7D6; --ch-a:#5A8FD6; --ch-b:#B8861E; --ch-grid:#24395A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B1626; --surface:#122238; --surface-2:#182C47; --line:#27405F;
  --fg:#E9E4D8; --muted:#A9B2C2; --faint:#7D889B; --gold-soft:#3E3522;
  --ok:#5BB38A; --warn:#D9B04A; --crit:#D8706B; --info:#7FA7D6; --ch-a:#5A8FD6; --ch-b:#B8861E; --ch-grid:#24395A; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:lining-nums tabular-nums}

/* Top bar */
.top{background:var(--navy);color:#F3EFE6;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.1}
.brand small{color:#C9B98C;letter-spacing:.12em;text-transform:uppercase;font-size:10.5px;font-weight:600}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{background:transparent;border:1px solid transparent;color:#D7D2C6;padding:7px 12px;border-radius:var(--r);cursor:pointer}
.tab:hover{border-color:#3B5074}
.tab[aria-selected="true"]{background:#1A3353;color:#fff;border-color:#2C4B74}
.menu{position:relative}
.menu-list{display:none;position:absolute;top:calc(100% + 4px);right:0;background:var(--navy);border:1px solid #2C4B74;border-radius:var(--r);padding:6px;min-width:210px;z-index:20;flex-direction:column;gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.menu.open .menu-list{display:flex}
.menu-list .tab{text-align:left;width:100%}
.tab.grp::after{content:" ▾";font-size:11px;opacity:.8}
.tab.grp[aria-selected="true"]{background:#1A3353}
a.tab{text-decoration:none;display:inline-block}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap;margin-bottom:10px}
.crumbs a,.crumbs button{background:none;border:0;padding:0;color:var(--info);cursor:pointer;font:inherit;font-weight:600}
.crumbs .sep{color:var(--faint)}
.btn-voltar{display:none}
@media (max-width:860px){.grid.has-sel .side{display:none}.btn-voltar{display:inline-flex}.crumbs .crumb-cli{display:none}}
.switch{display:flex;align-items:center;gap:8px;color:#D7D2C6;font-size:13px;cursor:pointer;user-select:none}
.switch input{accent-color:var(--gold);width:16px;height:16px}

.wrap{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-inline:20px}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}

/* Sidebar */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--gold-soft)}
.row .n{font-weight:600}
.row .s{color:var(--muted);font-size:13px}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:#163055}
.btn.gold{background:var(--gold);color:#1B1A14;border-color:var(--gold)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.danger{color:var(--crit)}
.btn:focus-visible,.tab:focus-visible,.row:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Main */
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--gold);font-weight:700}
.sub{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1;margin-top:4px}
.kpi .h{font-size:12.5px;color:var(--muted);margin-top:4px}

.section{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

/* Contract cards */
.contracts{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
@media (max-width:420px){.contracts{grid-template-columns:1fr}}
.ct{padding:0;display:flex;flex-direction:column;overflow:hidden}
.ct-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ct-h .bank{font-weight:700;font-size:16px}
.ct-h .prod{color:var(--muted);font-size:13px}
.ct-b{padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.kv .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv .v{font-weight:600}
.ct-proj{border-top:1px solid var(--line);padding:12px 16px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.range{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.range .big{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.range .mm{color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:4px}
.ct-f{border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.ct-f .acts{display:flex;gap:6px}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;letter-spacing:.02em;border:1px solid transparent}
.pill.e1{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.e2{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.e3{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.pill.c{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.pill.g{background:var(--gold-soft);color:var(--fg)}
.conf{font-size:12px;color:var(--muted)}
.conf b{color:var(--fg)}

.spark{width:100%;height:auto;display:block;margin-top:4px}
.spark text{font-family:var(--body);fill:var(--muted)}
.dash{display:grid;grid-template-columns:1fr;gap:16px}
.chart{padding:18px 22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chart svg.wide{max-width:980px}
.chart .donut-wrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.chart .donut-wrap .legend{flex-direction:column;gap:10px;font-size:14px}
.chart h3{font-size:20px}
.chart .sub{font-size:14px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--body);fill:var(--muted);font-size:12px}
.chart .lbl{fill:var(--fg);font-weight:600}
.chart .val{fill:var(--fg);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:var(--navy);color:#fff;font-size:12.5px;padding:7px 10px;border-radius:6px;z-index:40;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.25);line-height:1.35}
.hit:hover{opacity:.85}
.note{font-size:13px;color:var(--muted)}
.disclaimer{border-left:3px solid var(--gold);padding:10px 14px;background:var(--surface);font-size:13px;color:var(--muted)}

/* Timeline */
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl li{list-style:none;position:relative;padding:4px 0 12px}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.subtab{background:transparent;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;font:inherit;font-weight:600;color:var(--muted);margin-bottom:-1px}
.subtab:hover{color:var(--fg)}
.subtab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gold)}
.subtab .cnt{display:inline-block;margin-left:6px;font-size:11px;color:var(--faint);font-weight:600}
.tl li::before{content:"";position:absolute;left:-23px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--surface)}
.tl .d{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* Forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.f input,.f select,.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.f.full{grid-column:1/-1}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(6,14,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:20}
.modal .card{width:min(820px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.help{font-size:12.5px;color:var(--muted)}

/* Tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.r,th.r{text-align:right}
td input{width:84px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}

.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);margin-bottom:6px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:14px;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.ro .edit-only{display:none!important}
@media (prefers-reduced-motion:no-preference){.row,.btn,.tab{transition:background .12s}}

[hidden]{display:none!important}
/* --- Supabase: login e modos --- */
.login{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.login .card{width:min(420px,100%);padding:28px;display:flex;flex-direction:column;gap:14px}
.login .eyebrow{color:var(--gold)}
.login h1{font-size:26px}
.login .f input{padding:10px 12px}
.login .err{color:var(--crit);font-size:13px;min-height:18px}
.login .btn.primary{width:100%;padding:11px}
.modo-cliente .side,.modo-cliente .tabs,.modo-cliente .switch{display:none!important}
.modo-cliente .grid{grid-template-columns:1fr}
.nao-admin .admin-only{display:none!important}
.userbox{display:flex;align-items:center;gap:10px;color:#D7D2C6;font-size:13px}
.userbox .btn{background:transparent;color:#D7D2C6;border-color:#3B5074;padding:5px 10px;font-size:13px;text-decoration:none}
.pendente{text-align:center;padding:48px 20px;color:var(--muted)}
.pendente h2{color:var(--fg);margin-bottom:8px}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><small>Neves Pádua Advocacia</small><b id="brandArea">Clientes</b></div>
  <nav class="tabs" role="tablist" id="nav"></nav>
  <label class="switch edit-only"><input type="checkbox" id="viewClient"> Visão do cliente</label>
  <div class="userbox" id="userbox" hidden><a class="btn" href="../">Portal</a><span id="userName"></span><button class="btn" id="btnSair">Sair</button></div>
</header>

<div class="wrap">
  <div id="view-clientes" class="grid">
    <aside class="side">
      <input class="search" id="q" placeholder="Buscar cliente…" aria-label="Buscar cliente">
      <div class="card list" id="clientList"><div class="empty">Carregando…</div></div>
      <button class="btn primary edit-only" id="btnNewClient">+ Novo cliente</button>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <div id="view-historico" hidden class="main"></div>
  <div id="view-regras" hidden class="main"></div>
  <div id="view-calibracao" hidden class="main"></div>
  <div id="view-usuarios" hidden class="main"></div>
  <div id="view-tarefas" hidden class="main"></div>
  <div id="view-horas" hidden class="main"></div>
  <div id="view-equipe" hidden class="main"></div>
  <div id="view-negociacoes" hidden class="main"></div>
  <div id="view-monitoramento" hidden class="main"></div>
  <div id="view-publicacoes" hidden class="main"></div>
  <div id="view-conhecimento" hidden class="main"></div>
  <div id="view-autenticador" hidden class="main"></div>
</div>

<div id="modalHost"></div>
<div id="toast" class="toast" hidden></div>

<div class="login" id="login">
  <div class="card">
    <div class="eyebrow">Neves Pádua Advocacia</div>
    <h1>Painel de Passivos Bancários</h1>
    <div class="f"><label for="l-email">E-mail</label><input id="l-email" type="email" autocomplete="username" placeholder="voce@empresa.com.br"></div>
    <div class="f"><label for="l-senha">Senha</label><input id="l-senha" type="password" autocomplete="current-password"></div>
    <div class="err" id="l-err"></div>
    <button class="btn primary" id="l-btn">Entrar</button>
    <div class="note">Acesso restrito à equipe do escritório e aos clientes convidados. Esqueceu a senha? Fale com o escritório.</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ---------- Runtime Supabase: mesma interface do banco do protótipo (doc/collection/onSnapshot) ---------- */
const SB = window.supabase.createClient("https://ksdwzljfjfucjevdqxvx.supabase.co", "sb_publishable_tt__gxUjGaujzylisID0KQ_qaeaU1-l");
const PP = {perfil:null, listeners:{}, cache:{}};
const TABELAS = {clientes:"clientes", contratos:"contratos", historico:"historico"};
const NOTA_CAMPO = {clientes:"notasInternas", contratos:"notas"};
const FICHA_COLS = ["nome","ativo","cpf_titular","tipo_pessoa","nome_fantasia","cidade","uf","segmento","faturamento_mensal","funcionarios","historia","situacao_atual","origem","closer","data_fechamento","data_onboarding","plano","status","negativado","usa_maquininha","tem_consorcio","outros_cnpjs","assuntos_interesse","disponibilidade","observacoes_onboarding","proxima_reuniao","created_at","updated_at","estagio_registrado","etapa_fluxo","tem_divida_atraso","adimplente","possui_processos","projeto_reserva","regua","servico","tipos_dividas","responsavel_onboarding_id","notion_url"];
const equipe = ()=>PP.perfil && (PP.perfil.papel==="admin"||PP.perfil.papel==="colaborador");

async function carregar(col){
  if(col==="historico" && !equipe()){
    const {data,error}=await SB.from("referencias").select("*");
    if(error) throw error;
    // formato compatível com referencias(): divida/valorAcordo sintéticos a partir do desconto
    return data.filter(r=>r.desc!=null).map(r=>({id:r.id,credor:r.credor,grupo:r.grupo,forma:r.forma,status:r.status,data:r.data,divida:1,valorAcordo:1-Number(r.desc)}));
  }
  const {data,error}=await SB.from(TABELAS[col]).select("*").order("id");
  if(error) throw error;
  let notas={};
  if(NOTA_CAMPO[col] && equipe()){
    const {data:ns}=await SB.from("notas_internas").select("id,texto");
    for(const n of (ns||[])) notas[n.id]=n.texto;
  }
  return data.map(r=>{const d={id:r.id,...r.dados};
    if(col==="clientes"){for(const [k,v] of Object.entries(r)){if(!["id","dados","token","acesso_por_token","created_by","updated_by"].includes(k)&&v!=null)d[k]=v}} // colunas da ficha (0008)
    if(NOTA_CAMPO[col]){const n=notas[(col==="clientes"?"cliente:":"contrato:")+r.id];if(n!=null)d[NOTA_CAMPO[col]]=n}return d});
}
async function notificar(col){
  try{const rows=await carregar(col);PP.cache[col]=rows;for(const cb of (PP.listeners[col]||[]))cb({docs:rows.map(r=>({id:r.id,data:()=>r}))})}
  catch(e){console.warn("carregar",col,e);toast("Falha ao carregar "+col)}
}
async function notificarRegras(){
  const {data,error}=await SB.from("regras").select("dados").eq("id","regras").maybeSingle();
  if(error){console.warn(error);return}
  for(const cb of (PP.listeners.regras||[]))cb({exists:!!data,data:()=>data?data.dados:null});
}
function parseRef(p){const [col,id]=p.split("/");return {col,id}}
async function gravar(col,id,doc,{merge=false}={}){
  if(col==="config"){const {error}=await SB.from("regras").upsert({id:"regras",dados:doc});if(error)throw error;return}
  const d={...doc};delete d.id;
  const notaCampo=NOTA_CAMPO[col];let nota=null;
  if(notaCampo){nota=d[notaCampo]??"";delete d[notaCampo]}
  if(merge){const {data:cur}=await SB.from(TABELAS[col]).select("dados").eq("id",id).maybeSingle();Object.assign(d,{...(cur?cur.dados:{}),...d})}
  if(col==="clientes"){for(const k of FICHA_COLS)delete d[k]}   // colunas da ficha não vão para o jsonb
  const row={id,dados:d};if(col==="contratos")row.cliente_id=d.clienteId;if(col==="clientes"&&d.cnpj)row.cnpj=d.cnpj;
  const {error}=await SB.from(TABELAS[col]).upsert(row);if(error)throw error;
  if(notaCampo && !merge){
    const nid=(col==="clientes"?"cliente:":"contrato:")+id;
    const {error:e2}=await SB.from("notas_internas").upsert({id:nid,cliente_id:col==="clientes"?id:d.clienteId,contrato_id:col==="contratos"?id:null,texto:nota||""});
    if(e2)throw e2;
  }
}
const novoId=(col)=>col.slice(0,3)+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
window.__PP_RUNTIME={use:async(n)=>{
  if(n==="db")return {
    doc:(p)=>{const {col,id}=parseRef(p);return {
      onSnapshot:(cb)=>{if(col==="config"){(PP.listeners.regras??=[]).push(cb);notificarRegras()}},
      set:async(doc)=>{await gravar(col,id,doc);await notificar(col)},
      update:async(partial)=>{await gravar(col,id,partial,{merge:true});await notificar(col)},
      delete:async()=>{const {error}=await SB.from(col==="config"?"regras":TABELAS[col]).delete().eq("id",id);if(error)throw error;await notificar(col)}
    }},
    collection:(col)=>({
      onSnapshot:(cb)=>{(PP.listeners[col]??=[]).push(cb);notificar(col)},
      add:async(doc)=>{const id=novoId(col);await gravar(col,id,doc);await notificar(col);return {id}}
    })
  };
  if(n==="user")return {can:async()=>equipe(),id:async()=>PP.perfil?.id||null};
  return null;
}};
/* tempo real: quando algo muda no banco, recarrega a coleção afetada */
function ligarTempoReal(){
  const mapa={clientes:"clientes",contratos:"contratos",historico:"historico",notas_internas:null,regras:"regras",perfis:"perfis"};
  const ch=SB.channel("painel");
  for(const t of Object.keys(mapa)){
    ch.on("postgres_changes",{event:"*",schema:"public",table:t},()=>{
      if(t==="regras")notificarRegras();
      else if(t==="notas_internas"){notificar("clientes");notificar("contratos")}
      else if(t==="perfis"){if(typeof renderUsuarios==="function"&&S.tab==="usuarios")renderUsuarios()}
      else notificar(mapa[t]);
    });
  }
  ch.subscribe();
}
/* ---------- Login e perfil ---------- */
window.__PP_LOGIN = new Promise(resolve=>{
  const show=(v)=>{document.querySelector("#login").hidden=!v};
  async function entrar(){
    const email=document.querySelector("#l-email").value.trim(), senha=document.querySelector("#l-senha").value;
    document.querySelector("#l-err").textContent="";
    const {error}=await SB.auth.signInWithPassword({email,password:senha});
    if(error){document.querySelector("#l-err").textContent="E-mail ou senha incorretos.";return}
  }
  document.querySelector("#l-btn").onclick=entrar;
  document.querySelector("#l-senha").onkeydown=e=>{if(e.key==="Enter")entrar()};
  document.querySelector("#btnSair").onclick=async()=>{await SB.auth.signOut();location.reload()};
  let iniciado=false;
  SB.auth.onAuthStateChange(async(ev,session)=>{
    if(!session){show(true);return}
    if(iniciado)return;iniciado=true;
    const {data:perfil}=await SB.from("perfis").select("*").eq("id",session.user.id).maybeSingle();
    PP.perfil=perfil||{id:session.user.id,papel:"pendente"};
    document.querySelector("#userbox").hidden=false;document.querySelector("#userName").textContent=perfil?.nome||session.user.email;
    show(false);
    if(PP.perfil.papel==="pendente"){
      document.body.classList.add("modo-cliente");
      document.querySelector("#main").innerHTML='<div class="card pendente"><h2>Acesso em análise</h2><div>Seu usuário foi criado, mas ainda não recebeu um perfil. Peça ao administrador do escritório para liberar o acesso.</div></div>';
      document.querySelector("#clientList").innerHTML="";
      return; // não resolve: nada carrega
    }
    if(PP.perfil.papel==="cliente"){document.body.classList.add("modo-cliente");S.clientView=true;S.sel=PP.perfil.cliente_id;S.tab="clientes"}
    if(PP.perfil.papel!=="admin")document.body.classList.add("nao-admin");
    if(S.tab==="usuarios"&&PP.perfil.papel!=="admin")S.tab="clientes";
    window.PP_ROTAS.push("usuarios","tarefas","horas","equipe","negociacoes","monitoramento","publicacoes","conhecimento","autenticador");
    if(equipe())aplicarHash();
    if(S.tab==="usuarios"&&PP.perfil.papel!=="admin")S.tab="clientes";
    ligarTempoReal();
    resolve();
  });
});

<script>
/* ---------- Tabelas regulatórias ---------- */
// Res. BCB 352/2023, Anexo I (ativos inadimplidos, >90 dias): provisão = A + B × meses desde o inadimplemento, teto 100%.
// Coeficientes coincidem com os fatores A e B da Lei 14.467/2022, art. 3º.
const CARTEIRAS = {
  C1:{A:0.055,B:0.045,nome:"C1 — Alienação fiduciária de imóvel, garantia da União, fundo garantidor (FGO/FGI)"},
  C2:{A:0.30, B:0.034,nome:"C2 — Leasing, hipoteca, penhor, alienação fiduciária de bem móvel, depósito, fiança bancária, seguro de crédito"},
  C3:{A:0.45, B:0.037,nome:"C3 — Desconto/antecipação de recebíveis, cessão fiduciária, aval ou fiança de terceiro, outras garantias"},
  C4:{A:0.35, B:0.045,nome:"C4 — Capital de giro, ACC/ACE, debêntures sem garantia; rural investimento sem garantia"},
  C5:{A:0.50, B:0.034,nome:"C5 — Rotativo sem garantia (cheque especial, cartão, conta garantida), crédito pessoal, rural custeio, demais sem garantia"}
};
// Anexo II (não inadimplidos, até 90 dias): por faixa de atraso.
const ANEXO2 = [
  {max:14,  p:{C1:.014,C2:.014,C3:.019,C4:.019,C5:.019}},
  {max:30,  p:{C1:.035,C2:.035,C3:.035,C4:.035,C5:.075}},
  {max:60,  p:{C1:.045,C2:.06, C3:.13, C4:.13, C5:.15}},
  {max:90,  p:{C1:.05, C2:.17, C3:.32, C4:.32, C5:.38}},
];
const PRODUTOS = {
  giro:"Capital de giro", cheque:"Cheque especial", contagar:"Conta garantida", cartao:"Cartão de crédito / corporativo",
  receb:"Antecipação de recebíveis / desconto", pronampe:"PRONAMPE / FGO / FGI", rural_custeio:"Crédito rural — custeio",
  rural_invest:"Crédito rural — investimento", veiculo:"Financiamento de veículo / máquina", imovel:"Financiamento imobiliário",
  leasing:"Leasing", ccb:"CCB / empréstimo simples", outro:"Outro"
};
const GARANTIAS = {
  nenhuma:"Sem garantia", aval:"Aval / fiança de sócio ou terceiro", recebiveis:"Cessão fiduciária de recebíveis",
  real_movel:"Alienação fiduciária / penhor de bem móvel", hipoteca:"Hipoteca", real_imovel:"Alienação fiduciária de imóvel",
  fundo:"Fundo garantidor (FGO / FGI)", fianca_bancaria:"Fiança bancária / seguro de crédito"
};
const SITUACOES = {
  emdia:"Em dia", cobranca:"Cobrança administrativa", negativado:"Negativado / protestado", ajuizado:"Ajuizado (execução / monitória)",
  prejuizo:"Baixado a prejuízo", cedido:"Cedido a FIDC / securitizadora", acordo:"Acordo em andamento", quitado:"Quitado"
};

function carteiraAuto(produto, garantia){
  if(garantia==="fundo"||garantia==="real_imovel"||produto==="pronampe"||produto==="imovel") return "C1";
  if(garantia==="real_movel"||garantia==="hipoteca"||garantia==="fianca_bancaria"||produto==="leasing"||produto==="veiculo") return "C2";
  if(garantia==="recebiveis"||produto==="receb"||garantia==="aval") return "C3";
  if(produto==="giro"||produto==="rural_invest") return "C4";
  return "C5";
}

/* ---------- Grupos de credor (comportamento observado) ---------- */
const GRUPOS = {varejo:"Banco de varejo",cooperativa:"Cooperativa de crédito",fidc:"FIDC / securitizadora",digital:"Banco digital / fintech",outro:"Outro"};
const FASES = {administrativa:"Cobrança administrativa",ajuizado:"Ajuizado",execucao:"Execução / cumprimento de sentença",cedido:"Cedido a FIDC"};
const FORMAS = {avista:"À vista",parcelado:"Parcelado"};
const TITULARES = {PJ:"Pessoa jurídica",PF:"Pessoa física (sócio)"};
function grupoBanco(nome){
  const n=(nome||"").toLowerCase();
  if(/sicoob|sicredi|cresol|unicred|ailos|coopera|credi/.test(n))return "cooperativa";
  if(/fidc|ativos|securitiz|recovery|ipanema|kobe|hoepers/.test(n))return "fidc";
  if(/nubank|inter|c6|picpay|neon|mercado pago|stone|infinite|will|original|pag/.test(n))return "digital";
  if(/ita[uú]|bradesco|santander|aymor|caixa|brasil|bb|safra|btg|banrisul|bnb|nordeste|amaz[oô]nia|votorantim|bv|pan|daycoval|abc|sofisa/.test(n))return "varejo";
  return "outro";
}
const normBanco=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").split(/[\s(]/)[0];

/* ---------- Regras padrão (editáveis na aba Regras) ---------- */
const REGRAS_PADRAO = {
  minDiasAtraso:180,          // só projetar acordo a partir de 6 meses de atraso
  usarHistorico:true,         // base primária = acordos reais; provisão vira contexto
  minRefs:2,                  // mínimo de acordos do mesmo credor para usar a mediana dele
  descontoBase:-15,           // fallback regulatório: desconto = provisão − 15 p.p. (quando não há histórico)
  amplitude:10,               // faixa = provável ± 10 p.p. quando há poucas referências
  fatorParcelado:-15,         // cenário parcelado = à vista − 15 p.p. (quando não há referência parcelada)
  tetoDesconto:97,
  margemReserva:10,           // reserva mensal = valor alvo × (1+10%) / meses
  prazoReservaPadrao:6,
  diasSemRegistro:15,        // alerta de gestão: cliente sem registro na timeline há mais de X dias
  atualizacaoMensal:1.0,      // % a.m. de atualização do saldo em atraso (juros de mora + correção) para estimar a dívida na data-alvo
  fatoresGarantia:{nenhuma:0,aval:-5,recebiveis:-10,real_movel:-5,hipoteca:"travar",real_imovel:"travar",fundo:"travar",fianca_bancaria:"travar"},
  fatoresProduto:{giro:0,cheque:0,contagar:0,cartao:0,receb:-5,pronampe:0,rural_custeio:-5,rural_invest:-5,veiculo:0,imovel:0,leasing:0,ccb:0,outro:0},
  fatoresSituacao:{emdia:0,cobranca:0,negativado:0,ajuizado:0,prejuizo:5,cedido:0,acordo:0,quitado:0},
  fatoresTitular:{PJ:-5,PF:0},
  fatoresGrupo:{varejo:0,cooperativa:-25,fidc:0,digital:-5,outro:-10},
  fatoresBanco:{"Itaú":0,"Bradesco":0,"Santander":0,"Banco do Brasil":0,"Caixa":0,"Sicoob":0,"Sicredi":0,"Safra":0,"BTG":0,"Nubank":0,"Inter":0,"C6":0,"PicPay":0}
};

/* ---------- Cálculo ---------- */
const DAY=86400000;
const hoje=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const parseD=s=>{if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmtD=d=>d?d.toLocaleDateString("pt-BR"):"—";
const addDays=(d,n)=>new Date(d.getTime()+n*DAY);
const BRL=v=>(v==null||isNaN(v))?"—":v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const pct=v=>(v==null||isNaN(v))?"—":Math.round(v*100)+"%";
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

function diasAtraso(c, ref=hoje()){const d=parseD(c.dataInicioAtraso);return d?Math.max(0,Math.round((ref-d)/DAY)):0}
function estagio(dias){return dias>90?3:dias>30?2:1}
function provisao(carteira,dias){
  if(dias<=90){const f=ANEXO2.find(x=>dias<=x.max);return f.p[carteira]}
  const k=CARTEIRAS[carteira];const meses=Math.floor((dias-90)/30);
  return Math.min(1,k.A+k.B*meses);
}
function mesesInad(dias){return dias>90?Math.floor((dias-90)/30):0}

/* Referências: histórico de acordos (base do escritório) + acordos fechados nos clientes do painel. */
function referencias(){
  const h=(S.historico||[]).filter(x=>x.status==="fechado"&&x.divida>0).map(x=>({credor:x.credor,grupo:x.grupo||grupoBanco(x.credor),forma:x.forma||"avista",desc:1-x.valorAcordo/x.divida,data:x.data,origem:"historico"}));
  const k=S.contratos.filter(x=>x.acordo&&x.acordo.fechado&&x.acordo.saldoNoAcordo>0).map(x=>({credor:x.banco,grupo:grupoBanco(x.banco),forma:(x.acordo.parcelas||1)>1?"parcelado":"avista",desc:+x.acordo.descontoObtido/100,data:x.acordo.data,origem:"cliente"}));
  return h.concat(k);
}
const mediana=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};
const quartil=(a,q)=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const i=(s.length-1)*q;const lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)};

function projetar(c,R,refsAll,ref=hoje()){
  const dias=diasAtraso(c,ref);
  const cart=c.carteiraOverride||carteiraAuto(c.produto,c.garantia);
  const prov=provisao(cart,dias);
  const est=estagio(dias);
  const fg=R.fatoresGarantia[c.garantia]??0;
  const travado=fg==="travar";
  const abertura=parseD(c.dataInicioAtraso)?addDays(parseD(c.dataInicioAtraso),R.minDiasAtraso):null;
  const janelaAberta=dias>=R.minDiasAtraso;
  const grupo=grupoBanco(c.banco);
  const nb=normBanco(c.banco);
  const refsBanco=refsAll.filter(r=>normBanco(r.credor)===nb);
  const refsGrupo=refsAll.filter(r=>r.grupo===grupo);
  let faixa=null,base=null;
  if(!travado){
    const teto=R.tetoDesconto/100;
    const ajusteComum=((fg||0)+(R.fatoresProduto[c.produto]??0)+(R.fatoresSituacao[c.situacao]??0)+(R.fatoresTitular[c.titular||"PJ"]??0)+(R.fatoresBanco[c.banco]??0))/100;
    // equivalente à vista: acordos parcelados entram convertidos (desconto − fatorParcelado), para não desperdiçar referência
    const eqAV=r=>r.forma==="parcelado"?r.desc-R.fatorParcelado/100:r.desc;
    const av=refsBanco.map(eqAV), pa=refsBanco.filter(r=>r.forma==="parcelado").map(r=>r.desc);
    const avG=refsGrupo.map(eqAV), paG=refsGrupo.filter(r=>r.forma==="parcelado").map(r=>r.desc);
    let avista,parcelado,fonte,pool;
    if(R.usarHistorico&&av.length>=R.minRefs){avista=mediana(av)+ajusteComum;fonte="banco";pool=av;}
    else if(R.usarHistorico&&avG.length>=R.minRefs){avista=mediana(avG)+ajusteComum;fonte="grupo";pool=avG;}
    else{avista=prov+(R.descontoBase+(R.fatoresGrupo[grupo]??0))/100+ajusteComum;fonte="provisao";pool=[];}
    if(R.usarHistorico&&pa.length>=1&&fonte==="banco")parcelado=mediana(pa)+ajusteComum;
    else if(R.usarHistorico&&paG.length>=R.minRefs&&fonte!=="provisao")parcelado=mediana(paG)+ajusteComum;
    else parcelado=avista+R.fatorParcelado/100;
    avista=clamp(avista,0,teto);parcelado=clamp(parcelado,0,teto);
    const min=pool.length>=3?clamp(quartil(pool,.25)+ajusteComum,0,teto):clamp(avista-R.amplitude/100,0,teto);
    const max=pool.length>=3?clamp(quartil(pool,.75)+ajusteComum,0,teto):clamp(avista+R.amplitude/100,0,teto);
    faixa={min:Math.min(min,avista),provavel:avista,max:Math.max(max,avista),parcelado};
    base={fonte,n:pool.length,mediana:pool.length?mediana(pool):null};
  }
  const saldo=+c.saldoAtual||+c.valorOriginal||0;
  const meses=+c.prazoReservaMeses||R.prazoReservaPadrao;
  // Cenário na data-alvo (hoje + prazo de reserva): saldo atualizado e provisão do banco nessa data
  const dataAlvo=new Date(ref);dataAlvo.setMonth(dataAlvo.getMonth()+meses);
  const diasAlvo=c.dataInicioAtraso?dias+meses*30:0;
  const provAlvo=provisao(cart,diasAlvo);
  const taxa=(c.atualizacaoMensal!=null&&c.atualizacaoMensal!==""?+c.atualizacaoMensal:R.atualizacaoMensal)/100;
  const saldoAlvo=c.dataInicioAtraso?saldo*Math.pow(1+taxa,meses):saldo;
  if(faixa&&base.fonte==="provisao"){ // base regulatória: refaz a faixa com a provisão da data-alvo
    const teto=R.tetoDesconto/100;const ajusteComum=((fg||0)+(R.fatoresProduto[c.produto]??0)+(R.fatoresSituacao[c.situacao]??0)+(R.fatoresTitular[c.titular||"PJ"]??0)+(R.fatoresBanco[c.banco]??0))/100;
    const av=clamp(provAlvo+(R.descontoBase+(R.fatoresGrupo[grupo]??0))/100+ajusteComum,0,teto);
    faixa={min:clamp(av-R.amplitude/100,0,teto),provavel:av,max:clamp(av+R.amplitude/100,0,teto),parcelado:clamp(av+R.fatorParcelado/100,0,teto)};
  }
  const valorAcordo=faixa?saldoAlvo*(1-faixa.provavel):null;      // acordo à vista na data-alvo
  const valorParcelado=faixa?saldoAlvo*(1-faixa.parcelado):null;
  const valorAcordoHoje=faixa?saldo*(1-faixa.provavel):null;
  const janelaNoPrazo=diasAlvo>=R.minDiasAtraso;
  const reservaMensal=valorAcordo!=null?valorAcordo*(1+R.margemReserva/100)/meses:null;
  const nSim=refsBanco.length;
  const conf=nSim>=5?"alta":nSim>=2?"média":refsGrupo.length>=5?"média":"baixa";
  return {dias,cart,prov,est,travado,janelaAberta,abertura,faixa,base,grupo,saldo,saldoAlvo,dataAlvo,diasAlvo,provAlvo,janelaNoPrazo,valorAcordo,valorAcordoHoje,valorParcelado,meses,reservaMensal,conf,nSim,nGrupo:refsGrupo.length};
}
function curva(c,cart,mesesAFrente=18){
  const d0=parseD(c.dataInicioAtraso);if(!d0)return [];
  const out=[];for(let m=0;m<=mesesAFrente;m++){const ref=new Date(hoje());ref.setMonth(ref.getMonth()+m);out.push(provisao(cart,Math.max(0,Math.round((ref-d0)/DAY))))}
  return out;
}

/* ---------- Estado ---------- */
const S={db:null,dbStatus:"pending",user:null,canWrite:null,clientes:[],contratos:[],historico:[],regras:structuredClone(REGRAS_PADRAO),sel:null,tab:"clientes",sub:"geral",clientView:false,q:""};
const $=s=>document.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="html")e.innerHTML=v;else if(v!=null)e.setAttribute(k,v)}for(const k of kids.flat()){if(k==null)continue;e.append(k.nodeType?k:document.createTextNode(k))}return e};
let toastT;const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)};
const readOnly=()=>S.clientView||S.canWrite===false;

const SVGNS="http://www.w3.org/2000/svg";
const sv=(tag,attrs={},...kids)=>{const e=document.createElementNS(SVGNS,tag);for(const[k,v]of Object.entries(attrs)){if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!=null)e.setAttribute(k,v)}for(const k of kids.flat()){if(k==null)continue;e.append(k.nodeType?k:document.createTextNode(k))}return e};

/* ---------- Render ---------- */
/* ---------- Navegação por áreas (pastas), rotas no # e breadcrumb ---------- */
const NAV=[{tab:"clientes",label:"Clientes"},
  {grupo:"juridico",label:"Jurídico",cls:"edit-only",itens:[{tab:"tarefas",label:"Tarefas e prazos"},{tab:"negociacoes",label:"Negociações"},{tab:"monitoramento",label:"Monitoramento"},{tab:"publicacoes",label:"Publicações (DJEN)"},{tab:"conhecimento",label:"Base de conhecimento"},{tab:"autenticador",label:"Autenticador (2FA)"},{tab:"historico",label:"Base de acordos"},{tab:"regras",label:"Regras de projeção"},{tab:"calibracao",label:"Calibração"}]},
  {grupo:"equipe",label:"Equipe",cls:"edit-only",itens:[{tab:"equipe",label:"Colaboradores"},{tab:"horas",label:"Horas"},{tab:"usuarios",label:"Usuários",cls:"admin-only"}]},{link:"../gestao/",label:"Gestão",cls:"edit-only"}];
const ROTAS=["clientes","historico","regras","calibracao"];window.PP_ROTAS=ROTAS;
const AREA_DE={};for(const n of NAV){if(n.tab)AREA_DE[n.tab]=n.label;if(n.itens)for(const i of n.itens)AREA_DE[i.tab]=n.label}
function irPara(tab){S.tab=tab;try{localStorage.setItem("pp-tab",tab)}catch(_){}document.querySelectorAll("#nav .menu.open").forEach(m=>m.classList.remove("open"));render()}
function renderNav(){
  const nav=$("#nav");nav.replaceChildren();
  for(const n of NAV){
    if(n.link){nav.append(el("a",{class:"tab "+(n.cls||""),href:n.link},n.label));continue}
    if(n.tab){nav.append(el("button",{class:"tab "+(n.cls||""),role:"tab","aria-selected":String(S.tab===n.tab),"data-tab":n.tab,onclick:()=>irPara(n.tab)},n.tab==="clientes"&&readOnly()?"Minha área":n.label));continue}
    const itens=n.itens.map(i=>el("button",{class:"tab "+(i.cls||""),role:"tab","aria-selected":String(S.tab===i.tab),"data-tab":i.tab,onclick:()=>irPara(i.tab)},i.label));
    const sel=n.itens.some(i=>i.tab===S.tab);
    const wrap=el("div",{class:"menu "+(n.cls||"")},el("button",{class:"tab grp","aria-selected":String(sel),"aria-haspopup":"true",onclick:e=>{e.stopPropagation();const o=wrap.classList.contains("open");document.querySelectorAll("#nav .menu.open").forEach(m=>m.classList.remove("open"));if(!o)wrap.classList.add("open")}},n.label),el("div",{class:"menu-list"},itens));
    nav.append(wrap);
  }
  const b=$("#brandArea");if(b)b.textContent=readOnly()?"Minha área":(AREA_DE[S.tab]||"Clientes");

  v.append(el("div",{class:"head"},el("div",{},el("div",{class:"eyebrow"},"Acessos"),el("h1",{},"Usuários"),el("div",{class:"sub"},"Para criar um usuário novo: Supabase → Authentication → Users → Add user (com Auto Confirm). Ele aparece aqui como 'pendente'; defina o perfil e, se for cliente, a empresa."))));
  const {data:ps,error}=await SB.from("perfis").select("*").order("email");
  if(error){v.append(el("div",{class:"card empty"},"Não foi possível carregar os usuários."));return}
  const PAPEIS={admin:"Administrador",colaborador:"Colaborador",cliente:"Cliente",pendente:"Pendente (sem acesso)"};
  const clientes=[...S.clientes].sort((a,b)=>(a.nome||"").localeCompare(b.nome||""));
  const tb=el("table",{},el("thead",{},el("tr",{},el("th",{},"E-mail"),el("th",{},"Nome"),el("th",{},"Perfil"),el("th",{},"Empresa (se cliente)"),el("th",{},""))),
    el("tbody",{},ps.map(p=>{
      const nome=inp("text",p.nome||"");
      const papel=sel(PAPEIS,p.papel);
      const cli=sel({"":"—",...Object.fromEntries(clientes.map(c=>[c.id,c.nome]))},p.cliente_id||"");
      const salvar=el("button",{class:"btn sm primary",onclick:async()=>{
        const upd={nome:nome.value.trim(),papel:papel.value,cliente_id:papel.value==="cliente"?(cli.value||null):null};
        if(papel.value==="cliente"&&!cli.value){toast("Escolha a empresa do cliente");return}
        const {error}=await SB.from("perfis").update(upd).eq("id",p.id);
        if(error){toast("Não foi possível salvar");return}
        // equipe ganha (ou atualiza) o registro em colaboradores, usado como responsável na timeline e nos processos
        if(upd.papel==="admin"||upd.papel==="colaborador"){const {error:e2}=await SB.from("colaboradores").upsert({perfil_id:p.id,nome:upd.nome||p.email},{onConflict:"perfil_id"});if(e2)console.warn(e2)}
        toast("Usuário salvo");
      }},"Salvar");
      return el("tr",{},el("td",{},p.email||"—"),el("td",{},nome),el("td",{},papel),el("td",{},cli),el("td",{},salvar));
    })));
  v.append(el("div",{class:"card section"},el("div",{class:"tbl"},tb)));
}
{ const _render=render; render=function(){ _render(); const u=$("#view-usuarios"); if(u){u.hidden=S.tab!=="usuarios"; if(S.tab==="usuarios")renderUsuarios()} }; }
</script>
