<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Manual de uso do sistema interno do Neves Pádua Advocacia: telas, passo a passo e fluxos.">
<meta property="og:title" content="Wiki Neves Pádua Interno">
<meta property="og:description" content="Manual de uso do sistema interno do Neves Pádua Advocacia: telas, passo a passo e fluxos.">
<meta property="og:type" content="website">
<title>Wiki Neves Pádua Interno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Wiki em três colunas (menu em árvore · artigo · nesta página), no visual do sistema: grafite único sobre papel, sem serifa e sem itálico. */
:root{
  --papel:#f3f2ef; --folha:#ffffff; --fio:#dedcd6; --fio2:#cfccc4; --tinta:#23272a; --tinta2:#5d6368; --tinta3:#868b8f;
  --grafite:#2a2e31; --sobre-grafite:#f3f2ef; --lateral:#eae9e5; --realce:#e2e0d9;
  --fatal:#a3282d; --alerta:#9a6a12; --ok:#1f7a4d; --info:#2f5f8a;
  --fatal-bg:#f7e9e9; --alerta-bg:#f6eedd; --ok-bg:#e5f1ea; --info-bg:#e8eef4;
  --sombra:0 1px 2px rgba(20,22,24,.06),0 8px 24px rgba(20,22,24,.06);
  --fonte:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-tema="escuro"]{
  --papel:#17191b; --folha:#1f2224; --fio:#34383b; --fio2:#43474a; --tinta:#eceae5; --tinta2:#a8adb1; --tinta3:#7f8488;
  --grafite:#eceae5; --sobre-grafite:#17191b; --lateral:#1b1d1f; --realce:#2b2f32;
  --fatal:#e3777b; --alerta:#dba64c; --ok:#5fc08f; --info:#86b3d9;
  --fatal-bg:#3a2224; --alerta-bg:#3a3020; --ok-bg:#1f3329; --info-bg:#212d38;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--papel);color:var(--tinta);font-family:var(--fonte);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;font-style:normal}
em,i,cite{font-style:normal}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:4px}
.app{display:grid;grid-template-columns:276px minmax(0,1fr);height:100%}
/* lateral */
.lat{background:var(--lateral);border-right:1px solid var(--fio);display:flex;flex-direction:column;min-height:0}
.marca{padding:20px 20px 10px;display:flex;flex-direction:column;align-items:center;text-decoration:none;gap:2px}
.marca .lg{font-weight:600;font-size:21px;letter-spacing:.06em;color:var(--grafite)}
.marca .sb{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--tinta2)}
.marca .vs{margin-top:6px;font-size:11.5px;font-weight:600;color:var(--tinta2);border:1px solid var(--fio2);border-radius:999px;padding:1px 9px}
.busca{margin:8px 14px 8px;display:flex;align-items:center;gap:8px;background:var(--folha);border:1px solid var(--fio);border-radius:9px;padding:8px 10px;color:var(--tinta2);width:calc(100% - 28px);text-align:left}
.busca svg{flex:none}
.busca kbd{margin-left:auto;font:inherit;font-size:11.5px;border:1px solid var(--fio);border-radius:5px;padding:0 6px;color:var(--tinta3)}
.arv{overflow:auto;padding:2px 10px 24px;flex:1;min-height:0}
.arv a,.arv .grp{display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border-radius:7px;text-decoration:none;border:0;background:none;text-align:left;line-height:1.35}
.arv .grp{font-weight:700;font-size:13px;margin-top:8px;color:var(--tinta)}
.arv .grp::before{content:"";width:6px;height:6px;border-right:1.6px solid var(--tinta2);border-bottom:1.6px solid var(--tinta2);transform:rotate(-45deg);transition:transform .15s;margin-right:3px;flex:none}
.arv .grp[aria-expanded="true"]::before{transform:rotate(45deg)}
.arv .sub{display:none;flex-direction:column;margin:1px 0 4px}
.arv .grp[aria-expanded="true"] + .sub{display:flex}
.arv a{color:var(--tinta2);font-size:14.3px}
.arv .sub a{padding-left:27px}
.arv a:hover{background:var(--realce);color:var(--tinta)}
.arv a[aria-current="page"]{background:var(--folha);color:var(--tinta);font-weight:600;box-shadow:inset 3px 0 0 var(--grafite),0 1px 2px rgba(0,0,0,.05)}
.arv .novo{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--ok);background:var(--ok-bg);border-radius:999px;padding:0 7px}
.lat-pe{border-top:1px solid var(--fio);padding:10px 14px;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--tinta2)}
.lat-pe .tema{margin-left:auto;display:flex;border:1px solid var(--fio);border-radius:8px;overflow:hidden;background:var(--folha)}
.lat-pe .tema button{border:0;background:none;padding:4px 8px;font-size:12px;color:var(--tinta2)}
.lat-pe .tema button[aria-pressed="true"]{background:var(--grafite);color:var(--sobre-grafite)}
/* conteúdo */
.cont{overflow:auto;min-height:0;scroll-behavior:smooth}
.topo{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--papel) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--fio);display:flex;align-items:center;gap:10px;padding:10px 28px;font-size:14px;color:var(--tinta2);min-height:50px}
.topo .cami b{color:var(--tinta);font-weight:600}
.topo .dir{margin-left:auto;display:flex;gap:8px;align-items:center}
.menu-btn{display:none;border:1px solid var(--fio);background:var(--folha);border-radius:7px;padding:4px 10px}
.grade{display:grid;grid-template-columns:minmax(0,800px) 210px;gap:44px;padding:30px 28px 90px;max-width:1110px;margin:0 auto}
article h1{font-weight:700;font-size:34px;line-height:1.15;margin:0 0 8px;letter-spacing:-.015em;text-wrap:balance}
article h2{font-weight:700;font-size:21px;margin:40px 0 10px;letter-spacing:-.01em;text-wrap:balance;scroll-margin-top:70px;padding-top:14px;border-top:1px solid var(--fio)}
article h2:first-of-type{border-top:0;padding-top:0}
article h3{font-size:16px;margin:24px 0 6px;font-weight:700}
.lead{font-size:17px;color:var(--tinta2);margin:0 0 16px;max-width:64ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 24px;font-size:13.5px}
.cam{border:1px solid var(--fio);background:var(--folha);border-radius:999px;padding:3px 11px;color:var(--tinta2)}
.cam b{color:var(--tinta);font-weight:600}
.abrir{display:inline-flex;align-items:center;gap:6px;background:var(--grafite);color:var(--sobre-grafite);border-radius:999px;padding:4px 13px;text-decoration:none;font-weight:600;font-size:13.5px;white-space:nowrap}
.abrir:hover{opacity:.9}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:1px 8px;vertical-align:1px}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.f{background:var(--fatal-bg);color:var(--fatal)} .tag.a{background:var(--alerta-bg);color:var(--alerta)} .tag.i{background:var(--info-bg);color:var(--info)} .tag.n{background:var(--realce);color:var(--tinta2)}
article p{margin:0 0 12px;max-width:70ch}
article ul,article ol{margin:0 0 14px;padding-left:22px;max-width:70ch}
article li{margin:4px 0}
article a{text-decoration:underline;text-decoration-color:var(--fio2);text-underline-offset:3px}
article a:hover{text-decoration-color:var(--tinta)}
article a.abrir,article a.card,article a.pn,article a.perfil{text-decoration:none}
.ui{font-weight:600;white-space:nowrap;background:var(--folha);border:1px solid var(--fio);border-radius:6px;padding:0 6px;font-size:.93em}
.k{font-variant-numeric:tabular-nums}
/* caixas */
.nota,.aviso,.dica,.regra{border:1px solid var(--fio);border-left:3px solid var(--info);background:var(--info-bg);padding:11px 14px;border-radius:0 9px 9px 0;margin:14px 0 18px;max-width:70ch}
.aviso{border-left-color:var(--fatal);background:var(--fatal-bg)}
.dica{border-left-color:var(--ok);background:var(--ok-bg)}
.regra{border-left-color:var(--grafite);background:var(--folha)}
.nota>b:first-child,.aviso>b:first-child,.dica>b:first-child,.regra>b:first-child{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.nota p:last-child,.aviso p:last-child,.dica p:last-child{margin:0}
/* passos */
.passos{list-style:none;padding:0;margin:10px 0 20px;counter-reset:p;max-width:72ch}
.passos>li{counter-increment:p;position:relative;padding:2px 0 12px 42px;margin:0}
.passos>li::before{content:counter(p);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--grafite);color:var(--sobre-grafite);font-weight:700;font-size:13.5px;display:grid;place-items:center}
.passos>li:not(:last-child)::after{content:"";position:absolute;left:13.5px;top:31px;bottom:2px;width:1px;background:var(--fio2)}
/* prints */
.shot{margin:10px 0 26px}
.tela{position:relative;border:1px solid var(--fio);border-radius:11px;background:var(--folha);box-shadow:var(--sombra);cursor:zoom-in}
.tela img{display:block;width:100%;height:auto;border-radius:10px}
.box{position:absolute;border:2px solid transparent;border-radius:6px;pointer-events:none;transition:border-color .12s,background .12s}
.box.on{border-color:var(--alerta);background:rgba(219,166,76,.12)}
.pin{position:absolute;width:23px;height:23px;margin:0;border:2px solid var(--folha);border-radius:50%;background:var(--grafite);color:var(--sobre-grafite);font-size:11.5px;font-weight:800;display:grid;place-items:center;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.3);z-index:2;line-height:1}
.pin.on,.pin:hover{background:var(--alerta);color:#fff}
.shot figcaption{display:flex;gap:10px;align-items:baseline;font-size:13.5px;color:var(--tinta2);padding:8px 2px 0}
.shot figcaption button{margin-left:auto;border:1px solid var(--fio);background:var(--folha);border-radius:7px;padding:1px 9px;font-size:12.5px;color:var(--tinta2);white-space:nowrap}
.leg{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2px 18px;max-width:none}
.leg li{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.45;padding:4px 6px;border-radius:7px;margin:0}
.leg li i{flex:none;width:21px;height:21px;border-radius:50%;background:var(--grafite);color:var(--sobre-grafite);font-weight:800;font-size:11px;display:grid;place-items:center;margin-top:1px}
.leg li.on{background:var(--alerta-bg)}
.leg li.on i{background:var(--alerta);color:#fff}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.dupla .shot{margin-bottom:10px}
.estreita{max-width:620px}
/* fluxo horizontal */
.fluxo{display:flex;flex-wrap:wrap;gap:10px 26px;margin:12px 0 22px}
.fluxo .et{position:relative;flex:1 1 140px;min-width:132px;border:1px solid var(--fio);border-top:3px solid var(--grafite);background:var(--folha);border-radius:0 0 10px 10px;padding:10px 12px}
.fluxo .et:not(:last-child)::after{content:"";position:absolute;right:-20px;top:50%;width:12px;height:12px;border-top:1.6px solid var(--tinta3);border-right:1.6px solid var(--tinta3);transform:translateY(-50%) rotate(45deg)}
.fluxo .et b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.fluxo .et span{font-size:13.3px;color:var(--tinta2);display:block;line-height:1.4;margin-top:2px}
.fluxo .et small{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:700;color:var(--tinta2);background:var(--realce);border-radius:999px;padding:0 8px}
.fluxo .et.f{border-top-color:var(--fatal)} .fluxo .et.a{border-top-color:var(--alerta)} .fluxo .et.o{border-top-color:var(--ok)} .fluxo .et.i{border-top-color:var(--info)}
/* linha do tempo vertical */
.trilho{position:relative;margin:12px 0 24px;padding-left:94px;max-width:720px}
.trilho::before{content:"";position:absolute;left:79px;top:8px;bottom:8px;width:2px;background:var(--fio2)}
.trilho .m{position:relative;margin:0 0 12px;background:var(--folha);border:1px solid var(--fio);border-radius:10px;padding:9px 13px}
.trilho .m::before{content:"";position:absolute;left:-20px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--folha);border:2.5px solid var(--grafite)}
.trilho .m.f::before{border-color:var(--fatal);background:var(--fatal)} .trilho .m.a::before{border-color:var(--alerta)} .trilho .m.o::before{border-color:var(--ok)} .trilho .m.i::before{border-color:var(--info)}
.trilho .m .d{position:absolute;left:-94px;top:9px;width:62px;text-align:right;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.trilho .m.f .d{color:var(--fatal)}
.trilho .m b{display:block;font-size:15px}
.trilho .m span{display:block;font-size:13.5px;color:var(--tinta2);line-height:1.45}
.trilho .m small{font-size:11.5px;font-weight:700;color:var(--tinta2);background:var(--realce);border-radius:999px;padding:0 8px;margin-top:4px;display:inline-block}
/* caminhos de decisão */
.caminhos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0 22px}
.caminhos>div{border:1px solid var(--fio);background:var(--folha);border-radius:11px;padding:13px 15px;border-top:3px solid var(--grafite)}
.caminhos>div.f{border-top-color:var(--fatal)} .caminhos>div.a{border-top-color:var(--alerta)} .caminhos>div.o{border-top-color:var(--ok)} .caminhos>div.i{border-top-color:var(--info)}
.caminhos b{display:block;font-size:15.5px;margin-bottom:3px}
.caminhos span{font-size:13.8px;color:var(--tinta2);display:block;line-height:1.5}
.caminhos ol,.caminhos ul{margin:6px 0 0;padding-left:18px;font-size:13.8px;color:var(--tinta2)}
/* raias (swimlane) */
.raias{border:1px solid var(--fio);border-radius:11px;overflow:hidden;margin:12px 0 22px;background:var(--folha)}
.raia{display:grid;grid-template-columns:150px 1fr;border-top:1px solid var(--fio)}
.raia:first-child{border-top:0}
.raia>b{background:var(--lateral);padding:12px 14px;font-size:13.5px;border-right:1px solid var(--fio);display:flex;align-items:center}
.raia>div{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;align-items:center}
.raia .p{border:1px solid var(--fio2);border-radius:8px;padding:5px 10px;font-size:13.5px;background:var(--papel)}
.raia .p i{font-weight:800;margin-right:6px;font-variant-numeric:tabular-nums}
.raia .p.f{border-color:var(--fatal);background:var(--fatal-bg)} .raia .p.a{border-color:var(--alerta);background:var(--alerta-bg)} .raia .p.o{border-color:var(--ok);background:var(--ok-bg)}
/* cartões */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px;margin:10px 0 26px}
.card{display:flex;flex-direction:column;gap:3px;border:1px solid var(--fio);background:var(--folha);border-radius:11px;padding:14px 16px;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--tinta2);transform:translateY(-1px)}
.card .ic{width:30px;height:30px;border-radius:8px;background:var(--grafite);color:var(--sobre-grafite);display:grid;place-items:center;margin-bottom:6px}
.card b{font-size:16.5px;font-weight:700}
.card span{font-size:13.8px;color:var(--tinta2);line-height:1.45}
.heroi{border:1px solid var(--fio);background:var(--folha);border-radius:14px;padding:26px 28px;margin:0 0 24px;box-shadow:var(--sombra);display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}
.heroi h1{font-size:32px;margin-bottom:6px}
.heroi .lead{margin-bottom:14px}
.heroi .acoes{display:flex;gap:8px;flex-wrap:wrap}
.heroi .acoes a.sec{display:inline-flex;align-items:center;border:1px solid var(--fio2);border-radius:999px;padding:4px 13px;text-decoration:none;font-weight:600;font-size:13.5px;background:var(--papel)}
.heroi img{width:100%;height:auto;border-radius:10px;border:1px solid var(--fio);box-shadow:var(--sombra)}
.perfis{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:12px 0 24px}
.perfil{display:block;border:1px solid var(--fio);background:var(--folha);border-radius:11px;padding:14px 16px}
.perfil:hover{border-color:var(--tinta2)}
.perfil b{display:block;font-size:16px}
.perfil span{display:block;font-size:13.5px;color:var(--tinta2);line-height:1.45}
.perfil ul{margin:8px 0 0;padding-left:18px;font-size:13.8px}
/* tabelas */
.tw{overflow-x:auto;margin:8px 0 20px;border:1px solid var(--fio);border-radius:10px;background:var(--folha)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--fio);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2);font-weight:700;background:var(--lateral)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* faq */
details.faq{border:1px solid var(--fio);background:var(--folha);border-radius:10px;margin:8px 0;max-width:76ch}
details.faq summary{cursor:pointer;padding:11px 14px;font-weight:600;list-style:none;display:flex;gap:10px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::before{content:"+";font-weight:800;color:var(--tinta2);width:12px}
details.faq[open] summary::before{content:"–"}
details.faq>div{padding:0 14px 12px 36px;color:var(--tinta2)}
details.faq>div p{margin:0 0 8px}
dl.glos{display:grid;grid-template-columns:200px 1fr;gap:0;border:1px solid var(--fio);border-radius:10px;overflow:hidden;background:var(--folha);margin:8px 0 22px}
dl.glos dt{font-weight:700;padding:9px 12px;border-top:1px solid var(--fio);background:var(--lateral);font-size:14px}
dl.glos dd{margin:0;padding:9px 12px;border-top:1px solid var(--fio);font-size:14.3px;color:var(--tinta2)}
dl.glos dt:first-of-type,dl.glos dt:first-of-type + dd{border-top:0}
/* navegação */
.pn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:46px}
.pn{border:1px solid var(--fio);background:var(--folha);border-radius:11px;padding:12px 16px;display:block}
.pn:hover{border-color:var(--tinta2)}
.pn small{display:block;color:var(--tinta2);font-size:12.5px}
.pn b{font-weight:700;font-size:16px}
.pn.r{text-align:right}
.rod{margin-top:26px;font-size:12.8px;color:var(--tinta3);display:flex;flex-wrap:wrap;gap:6px 16px}
/* nesta página */
.np{position:sticky;top:70px;align-self:start;font-size:13.5px}
.np>b{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta2);margin-bottom:8px}
.np button{display:block;border:0;background:none;padding:4px 0 4px 11px;border-left:2px solid var(--fio);color:var(--tinta2);text-align:left;width:100%;line-height:1.35}
.np button:hover,.np button.on{color:var(--tinta);border-left-color:var(--grafite)}
.np .rel{margin-top:22px}
.np .rel a{display:block;padding:3px 0;color:var(--tinta2);text-decoration:none}
.np .rel a:hover{color:var(--tinta)}
/* busca */
.modal{position:fixed;inset:0;background:rgba(20,22,24,.5);display:none;align-items:flex-start;justify-content:center;padding:9vh 16px;z-index:30}
.modal.on{display:flex}
.cx{background:var(--folha);border:1px solid var(--fio);border-radius:13px;width:min(660px,100%);max-height:74vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.cx input{border:0;border-bottom:1px solid var(--fio);padding:15px 18px;font:inherit;font-size:16.5px;background:transparent;color:var(--tinta);outline:none}
.res{overflow:auto;padding:6px}
.res a{display:block;padding:9px 12px;border-radius:8px;text-decoration:none}
.res a small{display:block;color:var(--tinta2);font-size:12.8px;line-height:1.4}
.res a b{font-weight:600}

function fluxo(a){return `<div class="fluxo">${a.map(e=>`<div class="et ${e.c||''}"><b>${e.t}</b>${e.s?`<span>${e.s}</span>`:''}${e.q?`<small>${e.q}</small>`:''}</div>`).join('')}</div>`}
function trilho(a){return `<div class="trilho">${a.map(e=>`<div class="m ${e.c||''}"><span class="d">${e.d||''}</span><b>${e.t}</b>${e.s?`<span>${e.s}</span>`:''}${e.q?`<small>${e.q}</small>`:''}</div>`).join('')}</div>`}
function caminhos(a){return `<div class="caminhos">${a.map(e=>`<div class="${e.c||''}"><b>${e.t}</b>${e.s?`<span>${e.s}</span>`:''}${e.l?`<ol>${e.l.map(x=>`<li>${x}</li>`).join('')}</ol>`:''}</div>`).join('')}</div>`}
function raias(a){return `<div class="raias">${a.map(r=>`<div class="raia"><b>${r.q}</b><div>${r.p.map(p=>`<span class="p ${p.c||''}">${p.n?`<i>${p.n}</i>`:''}${p.t}</span>`).join('')}</div></div>`).join('')}</div>`}

let _shotN=0;
function shot(nome,leg,cap,cl){
  const c=CAPS[nome]; if(!c) return `<p class="aviso">Print “${nome}” não encontrado.</p>`;

  const pins=(c.pins||[]).filter(p=>p[1]!=null && leg[p[0]-1]);

  return `<figure class="shot ${cl||''}" id="${id}" data-nome="${nome}" data-cap="${(cap||'').replace(/"/g,'&quot;')}"${c.w<760?` style="max-width:${Math.round(c.w*1.15)}px"`:''}><div class="tela" style="aspect-ratio:${c.w}/${c.h}"><img src="img/${nome}.jpg" alt="${(cap||nome).replace(/"/g,'')}" loading="lazy" width="${c.w}" height="${c.h}">${boxes}${bad}</div><figcaption><span>${cap||''}</span><button type="button" class="amp">Ampliar</button></figcaption>${lg}</figure>`;

P.push({id:'regras',g:'Referência',t:'Regras da casa',destaque:true,lead:'As regras do escritório que valem dentro do sistema, reunidas em um lugar.',kw:'regras da casa prazo fatal meta interna protocolo 12h lida tratada cadastro cliente r1 entrada garantia real cargos folga feriado',rel:['perfis','f-cadeia','glossario'],h:`
<h2>Prazos</h2>
<ul>
<li>Todo prazo processual vira cadeia de tarefas. O prazo legal fica como <b>fatal</b>; a meta interna é sempre anterior.</li>
<li>Prazo interno padrão de 10 dias quando o legal é de 15.</li>
<li>Conferir o protocolo é sempre da controladoria, um dia depois da meta.</li>
<li>No dia fatal: protocolar até 12h e confirmar na tela Hoje.</li>
<li>Prazo sugerido pelo sistema nunca vira fatal sem conferência humana.</li>
<li>Mudar prazo exige motivo; gestão e controladoria são avisadas.</li>
<li>Cores: fatal em vermelho, atrasado em amarelo.</li>
</ul>
<h2>Publicações</h2>
<ul>
<li>“Lida” não é “tratada”.</li>
<li>Intimações distintas do mesmo processo e do mesmo dia são analisadas uma a uma.</li>
<li>Atos decisórios passam por análise de cabimento de quem fará a peça. “Não recorrer” exige motivo, revisão e comunicação ao cliente.</li>
</ul>
<h2>Clientes</h2>
<ul>
<li>O cadastro do cliente não pode ser perdido em nenhuma mudança do sistema.</li>
<li>A linha do tempo guarda o que o escritório faz. Andamentos e publicações ficam no processo.</li>
<li>O formulário de mapeamento vai na assinatura. A R1 só acontece com a entrada paga.</li>
<li>No superendividamento, dívidas do mesmo credor viram uma parcela só.</li>
</ul>
<h2>Negociação</h2>
<ul>
<li>Dívida com garantia real dificilmente tem acordo bom e traz risco alto de perda do bem.</li>
<li>Alçada, desconto e êxito seguem os contratos e as regras reais, nunca percentuais presumidos.</li>
<li>Acordos registra cada acordo fechado na Base de acordos; a consulta é da gestão.</li>
</ul>
<h2>Acessos</h2>
<ul>
<li>Pessoas ocupam cargos. Cargos têm responsabilidades e permissões. Ações têm autores individuais.</li>
<li>O login é liberado pelas sócias.</li>
<li>Os códigos do Autenticador não saem do sistema.</li>
</ul>
<h2>Expediente</h2>
<ul><li>Folga só em feriados nacionais. Estaduais e municipais contam apenas para prazos.</li></ul>
`});

P.push({id:'glossario',g:'Referência',t:'Glossário',lead:'Os termos que aparecem nas telas, em ordem alfabética.',kw:'glossário termos significado dicionário',rel:['regras','faq'],h:`
<dl class="glos">
<dt>Análise de cabimento</dt><dd>Tarefa de quem fará a peça para decidir o caminho diante de sentença, decisão ou acórdão: ED, ED e depois apelação, apelação ou não recorrer.</dd>
<dt>Andamento</dt><dd>Movimentação do processo no tribunal. Fica na página do processo. Também é o texto “o que foi feito” exigido para concluir uma tarefa.</dd>
<dt>Ata</dt><dd>Registro de reunião com o cliente (R1, R2, R3, mensal), com resumo, participantes e links.</dd>
<dt>Base de acordos</dt><dd>Os acordos fechados pelo escritório, que alimentam a projeção.</dd>
<dt>Cadeia</dt><dd>Conjunto de tarefas criado a partir de um prazo: confeccionar, revisar, preparo, protocolar e conferir.</dd>
<dt>Calibração</dt><dd>Comparação entre o desconto real e o projetado, por banco, com sugestão de ajuste.</dd>
<dt>Cargo</dt><dd>Função com responsabilidades e permissões. Pessoas ocupam cargos; um cargo vago acumula tarefas na fila.</dd>
<dt>Carteira PJ</dt><dd>Os clientes de Gestão de Passivos Bancários PJ.</dd>
<dt>Conferir protocolo</dt><dd>Tarefa da controladoria que confirma que a peça foi protocolada.</dd>
<dt>Dossiê</dt><dd>Aba inicial da ficha do cliente: as três frentes e a linha do tempo.</dd>
<dt>Fatal</dt><dd>O prazo legal. Aparece em vermelho.</dd>
<dt>Fila</dt><dd>Tarefas de um cargo que ainda não foram assumidas por um ocupante.</dd>
<dt>Frente</dt><dd>Estratégico/Consultivo, Jurídico/Contencioso ou Negocial/Acordos.</dd>
<dt>Janela de acordo</dt><dd>Período projetado em que o acordo fica viável, a partir dos dias de atraso.</dd>
<dt>Meta interna</dt><dd>A data em que o escritório quer protocolar, sempre antes do fatal.</dd>
<dt>Monitoramento</dt><dd>Busca de processos novos pelos CPFs e CNPJs dos clientes e sócios.</dd>
<dt>Núcleo</dt><dd>Setor da tarefa ou do colaborador (Jurídico, Acordos, Financeiro…).</dd>
<dt>Pasta</dt><dd>Agrupador do processo e dos documentos; existe também pasta sem processo.</dd>
<dt>Preparo</dt><dd>Custas do recurso. Tem cadeia própria: calcular, informar o cliente, acompanhar e recolher.</dd>
<dt>Prazo a conferir</dt><dd>Prazo sugerido pelo sistema que ainda precisa de conferência humana.</dd>
<dt>Projeção</dt><dd>Estimativa de acordo e de reserva de cada dívida, a partir da base e das regras.</dd>
<dt>R1, R2, R3</dt><dd>As três reuniões do ciclo inicial do cliente PJ.</dd>
<dt>Raio-X</dt><dd>Quadro das dívidas do cliente PJ na aba Acompanhamento PJ.</dd>
<dt>Régua de cobrança</dt><dd>A sequência de contatos de D-5 a D+7 em torno do vencimento do boleto.</dd>
<dt>Remanescente</dt><dd>Cobrança do mês anterior remarcada para o mês atual.</dd>
<dt>Requisição</dt><dd>Pedido de férias, folga, horário reduzido, ausência, atestado ou home office.</dd>
<dt>Reserva de quitação</dt><dd>Valor que o cliente junta todo mês para pagar o acordo projetado.</dd>

<dt>Tratar</dt><dd>Decidir o que fazer com a publicação e criar as tarefas. Diferente de apenas ler.</dd>
</dl>
`});

P.push({id:'faq',g:'Referência',t:'Perguntas frequentes',destaque:true,lead:'As dúvidas mais comuns, com a resposta curta e o atalho para a tela.',kw:'faq perguntas dúvidas ajuda problema não vejo esqueci',rel:['regras','glossario','perfis'],h:`
<h2>Acesso</h2>
${faq([
 {q:'Não vejo um item do menu que aparece no manual.',r:'<p>O menu depende do seu cargo. Os prints foram feitos com acesso de sócia. Para liberar outra área, fale com a administração. '+ir('entrar','Ver acesso')+'.</p>'},
 {q:'Esqueci a senha.',r:'<p>Fale com o escritório para receber uma nova. Depois troque em Meu perfil › Segurança e senha.</p>'},
 {q:'Como mudo para o tema escuro?',r:'<p>No ícone de lua, na barra de cima, ou em Meu perfil › Aparência.</p>'}])}
<h2>Tarefas e prazos</h2>
${faq([
 {q:'Por que não vejo as tarefas dos colegas?',r:'<p>A tela abre só com as suas. Se você tem acesso, escolha a pessoa em '+ui('Ver tarefas de')+'. A visão de todos fica em Gestão › Visão geral.</p>'},
 {q:'Como mudo o prazo de uma tarefa?',r:'<p>Abra a tarefa › '+ui('Mais ações')+' › '+ui('Editar / reagendar…')+'. O motivo é obrigatório. '+ir('nova-tarefa','Ver passo a passo')+'.</p>'},

 {q:'Decidimos não recorrer. O que acontece?',r:'<p>O sistema pede o motivo, envia para revisão de quem responde pelo jurídico e abre “Comunicar o cliente”. '+ir('f-cabimento','Ver caminhos')+'.</p>'}])}
<h2>Clientes e acordos</h2>

 {q:'Fechei um acordo. O que mais preciso fazer?',r:'<p>Mova a negociação para “Acordo formalizado” e registre o acordo na Base de acordos. '+ir('f-acordo','Ver fluxo')+'.</p>'},
 {q:'Os valores de projeção são garantidos?',r:'<p>Não. São projeções para visualização; o que vale são os contratos e as regras reais.</p>'}])}
<h2>Pessoal</h2>

 {q:'Como peço folga ou férias?',r:'<p>Meu perfil › '+ui('+ Requisição')+'. A resposta chega no sino. '+ir('perfil','Ver passo a passo')+'.</p>'},
 {q:'Como lanço horas sem cronômetro?',r:'<p>Em Horas › Minha semana, pelo '+ui('+')+' do dia, ou na tarefa › Mais ações › Horas manuais.</p>'},
 {q:'Onde copio o código de 2FA de um tribunal?',r:'<p>Ferramentas › Autenticador › '+ui('Copiar')+'. Não envie o código por mensagem.</p>'}])}

P.push({id:'sobre',g:'Referência',t:'Sobre este manual',lead:'Como o manual foi feito, como os prints foram protegidos e como pedir uma atualização.',kw:'sobre manual versão atualização prints anonimização',rel:['novidades','inicio'],h:`
<h2>Versão</h2>
<p>Versão 2, de 27/11/2026, feita a partir de um tour completo pelo sistema em 26 e 27/11/2026. Substitui a versão 1 (esqueleto de 24/11/2026). O que mudou está em ${ir('novidades','O que mudou')}.</p>
<h2>Prints e privacidade</h2>
<ul>
<li>Os nomes de clientes são fictícios e consistentes entre os prints (o mesmo cliente tem sempre o mesmo nome inventado).</li>
<li>CPF, CNPJ, valores em reais, e-mails, telefones e códigos de acesso aparecem borrados.</li>
<li>Números de processo foram trocados por números inventados.</li>
<li>Telas com dados pessoais sensíveis (como o formulário do plano de superendividamento) foram descritas sem print.</li>
<li>Nenhum dado foi alterado no sistema durante as capturas: janelas foram abertas só para leitura e canceladas.</li>
</ul>
<h2>Pedir atualização</h2>
<p>Se uma tela mudou ou um passo não funciona como descrito, avise a gestão com o nome da página deste manual e o que está diferente.</p>
`});

</script>
<script>
/* ───────── aplicação ───────── */
const GRUPOS=[]; P.forEach(p=>{if(!GRUPOS.includes(p.g))GRUPOS.push(p.g)});
const $=s=>document.querySelector(s);
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const slug=s=>norm(s).replace(/<[^>]+>/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
const texto=h=>String(h).replace(/<script[\s\S]*?<\/script>/g,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&quot;/g,'"').replace(/\s+/g,' ').trim();
function guardar(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function ler(k){try{return localStorage.getItem(k)}catch(e){return null}}
/* tema */
function aplicaTema(t){const esc=t==='escuro'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.tema=esc?'escuro':'claro';document.querySelectorAll('.tema button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t))}
let tema=ler('wiki-np-tema')||'auto'; aplicaTema(tema);
document.querySelectorAll('.tema button').forEach(b=>b.onclick=()=>{tema=b.dataset.t;guardar('wiki-np-tema',tema);aplicaTema(tema)});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>tema==='auto'&&aplicaTema('auto'));
/* menu */
function montaMenu(){
  const arv=$('#arv');let h='';
  GRUPOS.forEach((g,gi)=>{const ps=P.filter(p=>p.g===g);
    if(g==='Início'){h+=ps.map(p=>`<a href="#/${p.id}" data-id="${p.id}">${p.t}${p.novo?'<span class="novo">novo</span>':''}</a>`).join('');return}
    h+=`<button class="grp" aria-expanded="false" data-g="${gi}">${g}</button><div class="sub">${ps.map(p=>`<a href="#/${p.id}" data-id="${p.id}">${p.m||p.t}${p.novo?'<span class="novo">novo</span>':''}</a>`).join('')}</div>`});
  arv.innerHTML=h;
  arv.querySelectorAll('.grp').forEach(b=>b.onclick=()=>b.setAttribute('aria-expanded',b.getAttribute('aria-expanded')!=='true'));
  arv.addEventListener('click',e=>{if(e.target.closest('a'))document.body.classList.remove('menu-on')});
}
/* render */
let atual=null;
function render(){
  const hs=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/');
  const p=P.find(x=>x.id===hs[0])||P[0];
  _shotN=0;
  const html=typeof p.h==='function'?p.h():p.h;
  const art=$('#art');
  const meta=[];
  if(p.cam)meta.push(`<span class="cam">${p.cam.split('>').map(x=>x.trim()).map((x,i,a)=>i===a.length-1?`<b>${x}</b>`:x).join(' › ')}</span>`);
  if(p.sys)meta.push(abrir(p.sys));
  if(p.quem)meta.push(`<span class="cam">Quem usa: <b>${p.quem}</b></span>`);
  art.innerHTML=(p.sem_titulo?'':`<h1>${p.t}</h1>${p.lead?`<p class="lead">${p.lead}</p>`:''}${meta.length?`<div class="meta">${meta.join('')}</div>`:''}`)+html+navPN(p)+`<div class="rod"><span>Wiki Neves Pádua Interno · versão 2</span><span>Prints de 26 e 27/11/2026 com nomes de clientes fictícios; documentos, valores e códigos borrados.</span></div>`;
  art.querySelectorAll('h2').forEach(h=>{if(!h.id)h.id=slug(h.textContent)});
  $('#cami').innerHTML=p.g==='Início'?`<b>${p.t}</b>`:`${p.g} / <b>${p.m||p.t}</b>`;
  $('#topoDir').innerHTML=p.sys?abrir(p.sys):'';
  montaNP(p);
  document.querySelectorAll('#arv a').forEach(a=>{const on=a.dataset.id===p.id;a.toggleAttribute('aria-current',false);if(on){a.setAttribute('aria-current','page');const sub=a.closest('.sub');if(sub)sub.previousElementSibling.setAttribute('aria-expanded','true')}});
  document.title=(p.id==='inicio'?'':p.t+' · ')+'Wiki Neves Pádua Interno';
  const cont=$('#cont');
  if(hs[1]){const alvo=document.getElementById(hs[1]);if(alvo){alvo.scrollIntoView();return}}
  if(atual!==p.id)cont.scrollTop=0;
  atual=p.id;
}
function navPN(p){const i=P.indexOf(p),a=P[i-1],b=P[i+1];return `<div class="pn-row">${a?`<a class="pn" href="#/${a.id}"><small>← Anterior</small><b>${a.m||a.t}</b></a>`:'<span></span>'}${b?`<a class="pn r" href="#/${b.id}"><small>Próxima →</small><b>${b.m||b.t}</b></a>`:'<span></span>'}</div>`}
function montaNP(p){
  const hs=[...document.querySelectorAll('#art h2')];
  let h='';
  if(hs.length>1)h+=`<b>Nesta página</b>`+hs.map(x=>`<button data-alvo="${x.id}">${x.textContent}</button>`).join('');
  if(p.rel&&p.rel.length)h+=`<div class="rel"><b>Veja também</b>${p.rel.map(id=>{const q=P.find(x=>x.id===id);return q?`<a href="#/${q.id}">${q.m||q.t}</a>`:''}).join('')}</div>`;
  const np=$('#np');np.innerHTML=h;
  np.querySelectorAll('button').forEach(b=>b.onclick=()=>{const el=document.getElementById(b.dataset.alvo);if(el)el.scrollIntoView({behavior:'smooth'})});
}
/* destaque dos pinos */
function liga(fig,n,on){fig.querySelectorAll(`[data-n="${n}"]`).forEach(e=>e.classList.toggle('on',on))}
document.addEventListener('mouseover',e=>{const t=e.target.closest('.pin,.leg li');if(!t)return;const fig=t.closest('.shot,.lb');if(fig)liga(fig,t.dataset.n,true)});
document.addEventListener('mouseout',e=>{const t=e.target.closest('.pin,.leg li');if(!t)return;const fig=t.closest('.shot,.lb');if(fig)liga(fig,t.dataset.n,false)});
document.addEventListener('focusin',e=>{const t=e.target.closest('.pin');if(t){const fig=t.closest('.shot,.lb');fig&&liga(fig,t.dataset.n,true)}});
document.addEventListener('focusout',e=>{const t=e.target.closest('.pin');if(t){const fig=t.closest('.shot,.lb');fig&&liga(fig,t.dataset.n,false)}});
/* lightbox */
let lbLista=[],lbI=0;
function abreLB(fig){lbLista=[...document.querySelectorAll('#art .shot')];lbI=lbLista.indexOf(fig);mostraLB();$('#lb').classList.add('on');$('#lbFechar').focus()}
function mostraLB(){const fig=lbLista[lbI];if(!fig)return;const tela=fig.querySelector('.tela').cloneNode(true);const c=CAPS[fig.dataset.nome];
  const pal=$('#lbPal');pal.innerHTML='';pal.appendChild(tela);
  const mob=window.innerWidth<=900;const maxW=mob?window.innerWidth-20:Math.min(1500,window.innerWidth-420);const maxH=mob?window.innerHeight*0.6:window.innerHeight-44;
  tela.style.width=Math.max(200,Math.min(maxW,maxH*c.w/c.h))+'px';
  const leg=fig.querySelector('.leg');
  $('#lbLado').innerHTML=`<h4>${fig.dataset.cap||'Print'}</h4><p>Passe o mouse nos números para ver cada ponto.</p>${leg?leg.outerHTML:''}<div class="ctl"><button id="lbAnt">← Anterior</button><button id="lbProx">Próximo →</button></div><p style="margin-top:8px">${lbI+1} de ${lbLista.length} prints nesta página</p>`;
  $('#lbAnt').onclick=()=>{lbI=(lbI-1+lbLista.length)%lbLista.length;mostraLB()};
  $('#lbProx').onclick=()=>{lbI=(lbI+1)%lbLista.length;mostraLB()};
}
function fechaLB(){$('#lb').classList.remove('on')}
document.addEventListener('click',e=>{
  const amp=e.target.closest('.shot .amp');if(amp){abreLB(amp.closest('.shot'));return}
  const tela=e.target.closest('#art .tela');if(tela&&!e.target.closest('.pin')){abreLB(tela.closest('.shot'));return}
  const pin=e.target.closest('#art .pin');if(pin){const fig=pin.closest('.shot');const li=fig.querySelector(`.leg li[data-n="${pin.dataset.n}"]`);if(li){li.scrollIntoView({block:'nearest',behavior:'smooth'});liga(fig,pin.dataset.n,true);setTimeout(()=>liga(fig,pin.dataset.n,false),1600)}}
});
$('#lbFechar').onclick=fechaLB;
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')fechaLB()});
/* busca */
const IDX=P.map(p=>{let h='';try{_shotN=0;h=typeof p.h==='function'?p.h():p.h}catch(e){}
  const secs=[...String(h).matchAll(/<h2[^>]*>([\s\S]*?)<\/h2>/g)].map(m=>texto(m[1]));
  return {p,t:norm(p.t+' '+(p.m||'')),k:norm((p.kw||'')+' '+(p.cam||'')),x:norm(texto(p.lead||'')+' '+texto(h)),raw:texto((p.lead||'')+' '+texto(h)),secs}});
let sel=0,resAtual=[];
function busca(q){
  const n=norm(q).trim();const r=$('#rBusca');
  if(!n){resAtual=P.filter(p=>p.destaque).map(p=>({p,sn:p.lead||''}));desenha(r,'');return}
  const termos=n.split(/\s+/).filter(Boolean);
  resAtual=IDX.map(o=>{let s=0;for(const t of termos){if(o.t.includes(t))s+=10;else if(o.k.includes(t))s+=6;else if(o.x.includes(t))s+=2;else return null}
    if(o.t.startsWith(termos[0]))s+=5;
    let sn=o.p.lead||'';const i=norm(o.raw).indexOf(termos[0]);if(i>=0){const a=Math.max(0,i-60);sn=(a>0?'…':'')+o.raw.slice(a,a+170)+'…'}
    const sec=o.secs.find(sc=>termos.every(t=>norm(sc).includes(t)));
    return {p:o.p,s,sn,sec}}).filter(Boolean).sort((a,b)=>b.s-a.s).slice(0,14);
  desenha(r,termos);
}
function marca(t,termos){if(!termos||!termos.length)return t;let out=t;termos.forEach(tt=>{const re=new RegExp('('+tt.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  const nt=norm(out);let res='',last=0,m;const reN=new RegExp(tt.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');while((m=reN.exec(nt))){res+=out.slice(last,m.index)+'<mark>'+out.slice(m.index,m.index+tt.length)+'</mark>';last=m.index+tt.length}res+=out.slice(last);out=res});return out}
function desenha(r,termos){sel=0;if(!resAtual.length){r.innerHTML='<div class="vazio">Nada encontrado. Tente outra palavra, como “prazo”, “ata”, “boleto” ou “cargo”.</div>';return}
  r.innerHTML=resAtual.map((o,i)=>`<a href="#/${o.p.id}${o.sec?'/'+slug(o.sec):''}" class="${i===0?'sel':''}"><b>${marca(o.p.t,termos)}</b><span class="g">${o.p.g}${o.sec?' · '+o.sec:''}</span><small>${marca(String(o.sn).replace(/</g,'&lt;'),termos)}</small></a>`).join('')}
function abreBusca(){$('#mBusca').classList.add('on');const q=$('#qBusca');q.value='';busca('');setTimeout(()=>q.focus(),10)}
function fechaBusca(){$('#mBusca').classList.remove('on')}
$('#abrirBusca').onclick=abreBusca;
$('#qBusca').addEventListener('input',e=>busca(e.target.value));
$('#qBusca').addEventListener('keydown',e=>{const as=[...document.querySelectorAll('#rBusca a')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!as.length)return;as[sel].classList.remove('sel');sel=(sel+(e.key==='ArrowDown'?1:-1)+as.length)%as.length;as[sel].classList.add('sel');as[sel].scrollIntoView({block:'nearest'})}
  if(e.key==='Enter'&&as[sel]){location.hash=as[sel].getAttribute('href');fechaBusca()}});
$('#rBusca').addEventListener('click',e=>{if(e.target.closest('a'))fechaBusca()});
$('#mBusca').addEventListener('click',e=>{if(e.target.id==='mBusca')fechaBusca()});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();abreBusca()}
  else if(e.key==='/'&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();abreBusca()}
  else if(e.key==='Escape'){fechaBusca();fechaLB();document.body.classList.remove('menu-on')}
  else if($('#lb').classList.contains('on')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){lbI=(lbI+(e.key==='ArrowRight'?1:-1)+lbLista.length)%lbLista.length;mostraLB()}
});
$('#menuBtn').onclick=()=>document.body.classList.toggle('menu-on');
montaMenu();window.addEventListener('hashchange',render);render();
</script>
