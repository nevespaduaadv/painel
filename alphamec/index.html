<title>Painel Alpha Mecânica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: lista de clientes à esquerda, painel do cliente à direita; stack em telas estreitas. */
:root{
  --navy:#0C1F38; --gold:#B8964A; --gold-soft:#E7DCC2;
  --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#EFEBE2; --line:#D9D3C6;
  --fg:#1B2433; --muted:#5E6878; --faint:#8A93A3;
  --ok:#2E7D5B; --warn:#B8860B; --crit:#A23B3B; --info:#2F5C8F;
  --ch-a:#2E5FA3; --ch-b:#B07A1C; --ch-grid:#E4DFD3;
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1626; --surface:#122238; --surface-2:#182C47; --line:#27405F;
  --fg:#E9E4D8; --muted:#A9B2C2; --faint:#7D889B; --gold-soft:#3E3522;
  --ok:#5BB38A; --warn:#D9B04A; --crit:#D8706B; --info:#7FA7D6; --ch-a:#5A8FD6; --ch-b:#B8861E; --ch-grid:#24395A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B1626; --surface:#122238; --surface-2:#182C47; --line:#27405F;
  --fg:#E9E4D8; --muted:#A9B2C2; --faint:#7D889B; --gold-soft:#3E3522;
  --ok:#5BB38A; --warn:#D9B04A; --crit:#D8706B; --info:#7FA7D6; --ch-a:#5A8FD6; --ch-b:#B8861E; --ch-grid:#24395A; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.top{background:var(--navy);color:#F3EFE6;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.1}
.brand small{color:#C9B98C;letter-spacing:.12em;text-transform:uppercase;font-size:10.5px;font-weight:600}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{background:transparent;border:1px solid transparent;color:#D7D2C6;padding:7px 12px;border-radius:var(--r);cursor:pointer}
.tab:hover{border-color:#3B5074}
.tab[aria-selected="true"]{background:#1A3353;color:#fff;border-color:#2C4B74}
.switch{display:flex;align-items:center;gap:8px;color:#D7D2C6;font-size:13px;cursor:pointer;user-select:none}
.switch input{accent-color:var(--gold);width:16px;height:16px}

.wrap{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-inline:20px}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}

/* Sidebar */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--gold-soft)}
.row .n{font-weight:600}
.row .s{color:var(--muted);font-size:13px}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:#163055}
.btn.gold{background:var(--gold);color:#1B1A14;border-color:var(--gold)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.danger{color:var(--crit)}
.btn:focus-visible,.tab:focus-visible,.row:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Main */
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--gold);font-weight:700}
.sub{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1;margin-top:4px}
.kpi .h{font-size:12.5px;color:var(--muted);margin-top:4px}

.section{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

/* Contract cards */
.contracts{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
@media (max-width:420px){.contracts{grid-template-columns:1fr}}
.ct{padding:0;display:flex;flex-direction:column;overflow:hidden}
.ct-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ct-h .bank{font-weight:700;font-size:16px}
.ct-h .prod{color:var(--muted);font-size:13px}
.ct-b{padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.kv .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv .v{font-weight:600}
.ct-proj{border-top:1px solid var(--line);padding:12px 16px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.range{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.range .big{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.range .mm{color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:4px}
.ct-f{border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.ct-f .acts{display:flex;gap:6px}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;letter-spacing:.02em;border:1px solid transparent}
.pill.e1{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.e2{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.e3{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.pill.c{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.pill.g{background:var(--gold-soft);color:var(--fg)}
.conf{font-size:12px;color:var(--muted)}
.conf b{color:var(--fg)}

.spark{width:100%;height:auto;display:block;margin-top:4px}
.spark text{font-family:var(--body);fill:var(--muted)}
.dash{display:grid;grid-template-columns:1fr;gap:16px}
.chart{padding:18px 22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chart svg.wide{max-width:980px}
.chart .donut-wrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.chart .donut-wrap .legend{flex-direction:column;gap:10px;font-size:14px}
.chart h3{font-size:20px}
.chart .sub{font-size:14px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--body);fill:var(--muted);font-size:12px}
.chart .lbl{fill:var(--fg);font-weight:600}
.chart .val{fill:var(--fg);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:var(--navy);color:#fff;font-size:12.5px;padding:7px 10px;border-radius:6px;z-index:40;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.25);line-height:1.35}
.hit:hover{opacity:.85}
.note{font-size:13px;color:var(--muted)}
.disclaimer{border-left:3px solid var(--gold);padding:10px 14px;background:var(--surface);font-size:13px;color:var(--muted)}

/* Timeline */
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl li{list-style:none;position:relative;padding:4px 0 12px}
.tl li::before{content:"";position:absolute;left:-23px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--surface)}
.tl .d{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* Forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.f input,.f select,.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.f.full{grid-column:1/-1}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(6,14,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:20}
.modal .card{width:min(820px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.help{font-size:12.5px;color:var(--muted)}

/* Tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.r,th.r{text-align:right}
td input{width:84px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}

.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);margin-bottom:6px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:14px;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.ro .edit-only{display:none!important}
@media (prefers-reduced-motion:no-preference){.row,.btn,.tab{transition:background .12s}}

.side,.tabs,.switch{display:none!important}
.grid{grid-template-columns:1fr}
.stamp{font-size:12px;color:var(--faint);text-align:right;margin-top:-6px}
</style>

<header class="top">
  <div class="brand"><small>Neves Pádua Advocacia</small><b>Painel de Passivos Bancários</b></div>

</header>

<div class="wrap">

    </aside>
    <main class="main" id="main"></main>
  </div>

  <div id="view-historico" hidden class="main"></div>
  <div id="view-regras" hidden class="main"></div>
  <div id="view-calibracao" hidden class="main"></div>
</div>

  fatoresBanco:{"Itaú":0,"Bradesco":0,"Santander":0,"Banco do Brasil":0,"Caixa":0,"Sicoob":0,"Sicredi":0,"Safra":0,"BTG":0,"Nubank":0,"Inter":0,"C6":0,"PicPay":0}

/* ---------- Cálculo ---------- */
const DAY=86400000;
const hoje=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const parseD=s=>{if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmtD=d=>d?d.toLocaleDateString("pt-BR"):"—";
const addDays=(d,n)=>new Date(d.getTime()+n*DAY);
const BRL=v=>(v==null||isNaN(v))?"—":v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const pct=v=>(v==null||isNaN(v))?"—":Math.round(v*100)+"%";
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

function diasAtraso(c, ref=hoje()){const d=parseD(c.dataInicioAtraso);return d?Math.max(0,Math.round((ref-d)/DAY)):0}
function estagio(dias){return dias>90?3:dias>30?2:1}
function provisao(carteira,dias){
  if(dias<=90){const f=ANEXO2.find(x=>dias<=x.max);return f.p[carteira]}
  const k=CARTEIRAS[carteira];const meses=Math.floor((dias-90)/30);
  return Math.min(1,k.A+k.B*meses);
}
function mesesInad(dias){return dias>90?Math.floor((dias-90)/30):0}

/* Referências: histórico de acordos (base do escritório) + acordos fechados nos clientes do painel. */
function referencias(){
  const h=(S.historico||[]).filter(x=>x.status==="fechado"&&x.divida>0).map(x=>({credor:x.credor,grupo:x.grupo||grupoBanco(x.credor),forma:x.forma||"avista",desc:1-x.valorAcordo/x.divida,data:x.data,origem:"historico"}));
  const k=S.contratos.filter(x=>x.acordo&&x.acordo.fechado&&x.acordo.saldoNoAcordo>0).map(x=>({credor:x.banco,grupo:grupoBanco(x.banco),forma:(x.acordo.parcelas||1)>1?"parcelado":"avista",desc:+x.acordo.descontoObtido/100,data:x.acordo.data,origem:"cliente"}));
  return h.concat(k);
}
const mediana=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};
const quartil=(a,q)=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const i=(s.length-1)*q;const lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)};

function projetar(c,R,refsAll,ref=hoje()){
  const dias=diasAtraso(c,ref);
  const cart=c.carteiraOverride||carteiraAuto(c.produto,c.garantia);
  const prov=provisao(cart,dias);
  const est=estagio(dias);
  const fg=R.fatoresGarantia[c.garantia]??0;
  const travado=fg==="travar";
  const abertura=parseD(c.dataInicioAtraso)?addDays(parseD(c.dataInicioAtraso),R.minDiasAtraso):null;
  const janelaAberta=dias>=R.minDiasAtraso;
  const grupo=grupoBanco(c.banco);
  const nb=normBanco(c.banco);
  const refsBanco=refsAll.filter(r=>normBanco(r.credor)===nb);
  const refsGrupo=refsAll.filter(r=>r.grupo===grupo);
  let faixa=null,base=null;
  if(!travado){
    const teto=R.tetoDesconto/100;
    const ajusteComum=((fg||0)+(R.fatoresProduto[c.produto]??0)+(R.fatoresSituacao[c.situacao]??0)+(R.fatoresTitular[c.titular||"PJ"]??0)+(R.fatoresBanco[c.banco]??0))/100;
    // equivalente à vista: acordos parcelados entram convertidos (desconto − fatorParcelado), para não desperdiçar referência
    const eqAV=r=>r.forma==="parcelado"?r.desc-R.fatorParcelado/100:r.desc;
    const av=refsBanco.map(eqAV), pa=refsBanco.filter(r=>r.forma==="parcelado").map(r=>r.desc);
    const avG=refsGrupo.map(eqAV), paG=refsGrupo.filter(r=>r.forma==="parcelado").map(r=>r.desc);
    let avista,parcelado,fonte,pool;
    if(R.usarHistorico&&av.length>=R.minRefs){avista=mediana(av)+ajusteComum;fonte="banco";pool=av;}
    else if(R.usarHistorico&&avG.length>=R.minRefs){avista=mediana(avG)+ajusteComum;fonte="grupo";pool=avG;}
    else{avista=prov+(R.descontoBase+(R.fatoresGrupo[grupo]??0))/100+ajusteComum;fonte="provisao";pool=[];}
    if(R.usarHistorico&&pa.length>=1&&fonte==="banco")parcelado=mediana(pa)+ajusteComum;
    else if(R.usarHistorico&&paG.length>=R.minRefs&&fonte!=="provisao")parcelado=mediana(paG)+ajusteComum;
    else parcelado=avista+R.fatorParcelado/100;
    avista=clamp(avista,0,teto);parcelado=clamp(parcelado,0,teto);
    const min=pool.length>=3?clamp(quartil(pool,.25)+ajusteComum,0,teto):clamp(avista-R.amplitude/100,0,teto);
    const max=pool.length>=3?clamp(quartil(pool,.75)+ajusteComum,0,teto):clamp(avista+R.amplitude/100,0,teto);
    faixa={min:Math.min(min,avista),provavel:avista,max:Math.max(max,avista),parcelado};
    base={fonte,n:pool.length,mediana:pool.length?mediana(pool):null};
  }
  const saldo=+c.saldoAtual||+c.valorOriginal||0;
  const meses=+c.prazoReservaMeses||R.prazoReservaPadrao;
  // Cenário na data-alvo (hoje + prazo de reserva): saldo atualizado e provisão do banco nessa data
  const dataAlvo=new Date(ref);dataAlvo.setMonth(dataAlvo.getMonth()+meses);
  const diasAlvo=c.dataInicioAtraso?dias+meses*30:0;
  const provAlvo=provisao(cart,diasAlvo);
  const taxa=(c.atualizacaoMensal!=null&&c.atualizacaoMensal!==""?+c.atualizacaoMensal:R.atualizacaoMensal)/100;
  const saldoAlvo=c.dataInicioAtraso?saldo*Math.pow(1+taxa,meses):saldo;
  if(faixa&&base.fonte==="provisao"){ // base regulatória: refaz a faixa com a provisão da data-alvo
    const teto=R.tetoDesconto/100;const ajusteComum=((fg||0)+(R.fatoresProduto[c.produto]??0)+(R.fatoresSituacao[c.situacao]??0)+(R.fatoresTitular[c.titular||"PJ"]??0)+(R.fatoresBanco[c.banco]??0))/100;
    const av=clamp(provAlvo+(R.descontoBase+(R.fatoresGrupo[grupo]??0))/100+ajusteComum,0,teto);
    faixa={min:clamp(av-R.amplitude/100,0,teto),provavel:av,max:clamp(av+R.amplitude/100,0,teto),parcelado:clamp(av+R.fatorParcelado/100,0,teto)};
  }
  const valorAcordo=faixa?saldoAlvo*(1-faixa.provavel):null;      // acordo à vista na data-alvo
  const valorParcelado=faixa?saldoAlvo*(1-faixa.parcelado):null;
  const valorAcordoHoje=faixa?saldo*(1-faixa.provavel):null;
  const janelaNoPrazo=diasAlvo>=R.minDiasAtraso;
  const reservaMensal=valorAcordo!=null?valorAcordo*(1+R.margemReserva/100)/meses:null;
  const nSim=refsBanco.length;
  const conf=nSim>=5?"alta":nSim>=2?"média":refsGrupo.length>=5?"média":"baixa";
  return {dias,cart,prov,est,travado,janelaAberta,abertura,faixa,base,grupo,saldo,saldoAlvo,dataAlvo,diasAlvo,provAlvo,janelaNoPrazo,valorAcordo,valorAcordoHoje,valorParcelado,meses,reservaMensal,conf,nSim,nGrupo:refsGrupo.length};
}
function curva(c,cart,mesesAFrente=18){
  const d0=parseD(c.dataInicioAtraso);if(!d0)return [];
  const out=[];for(let m=0;m<=mesesAFrente;m++){const ref=new Date(hoje());ref.setMonth(ref.getMonth()+m);out.push(provisao(cart,Math.max(0,Math.round((ref-d0)/DAY))))}
  return out;
