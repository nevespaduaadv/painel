# Verificação de geração em todo PR para main (G1–G3, N1–N3, T1) + laboratórios de QA (casca, tarefas, negociações, acompanhamento, hoje-agenda-avisos, integrações, formulários).
# Não faz deploy, não publica, não escreve no repositório. Sem segredos: o gerador só usa chaves publicáveis já versionadas.
name: verificar-geracao
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # sete laboratórios somam ~9 min no runner; o de formulários (Fase 4C) não cabia nos 10 min
    env:
      TZ: America/Sao_Paulo # os laboratórios geram datas "hoje ± n" na hora local e os módulos usam UTC-3: sem isto, entre 00h e 03h UTC os dias não batem
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fase do PR (padrão 3 = todas as verificações; rótulo "fase-0" aplica a comparação estrita)
        id: fase
        run: |
          if echo '${{ toJson(github.event.pull_request.labels.*.name) }}' | grep -q '"fase-0"'; then echo "fase=0" >> "$GITHUB_OUTPUT"; else echo "fase=3" >> "$GITHUB_OUTPUT"; fi
      - name: verificar-geracao
        run: node fontes/verificar-geracao.mjs --base origin/${{ github.base_ref }} --fase ${{ steps.fase.outputs.fase }}
      - name: Laboratório da casca (navegação real, dados fictícios, sem rede)
        run: |
          npm i -g --no-fund --no-audit playwright@1.49.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
          NODE_PATH="$(npm root -g)" node docs/qa/casca-lab.cjs "$RUNNER_TEMP/casca-lab"
      - name: Laboratório de Tarefas e prazos V3.1
        run: NODE_PATH="$(npm root -g)" node docs/qa/tarefas-lab.cjs "$RUNNER_TEMP/casca-lab/tarefas"
      - name: Laboratório de Negociações V3.1
        run: NODE_PATH="$(npm root -g)" node docs/qa/negociacoes-lab.cjs "$RUNNER_TEMP/casca-lab/negociacoes"
      - name: Laboratório de Acompanhamento PJ V3.1
        run: NODE_PATH="$(npm root -g)" node docs/qa/acompanhamento-lab.cjs "$RUNNER_TEMP/casca-lab/acompanhamento"
      - name: Laboratório de Hoje, Agenda e Avisos V3.1
        run: NODE_PATH="$(npm root -g)" node docs/qa/hoje-agenda-avisos-lab.cjs "$RUNNER_TEMP/casca-lab/hoje"
      - name: Laboratório de integrações entre módulos (Fase 4B)
        run: NODE_PATH="$(npm root -g)" node docs/qa/integracoes-lab.cjs "$RUNNER_TEMP/casca-lab/integracoes"
      - name: Laboratório de formulários (Fase 4C · NPUI.form + Registrar ata)
        run: NODE_PATH="$(npm root -g)" node docs/qa/formularios-lab.cjs "$RUNNER_TEMP/casca-lab/formularios"
      - name: Guardar relatório e capturas do laboratório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casca-lab
          path: ${{ runner.temp }}/casca-lab
          retention-days: 14
