@font-face{font-family:"General Sans";font-weight:300;font-display:swap;src:url(passivos/fontes/general-sans-300.woff2) format("woff2")}

/* Layout: lista de clientes à esquerda, painel do cliente à direita; stack em telas estreitas. */
/* ============================================================================
   Neves Pádua — tokens do Design System (V3.1 consolidada)
   Fonte da verdade: fontes/tokens.css. O gerador (fontes/gerar-app-supabase.mjs)
   inclui este arquivo no <style> de index.html, cliente/index.html e beta/index.html,
   no lugar do comentário-âncora TOKENS de fontes/painel.html. (gestao/index.html é só
   um redirecionamento para #visao e não tem CSS próprio.)

   FASE 0 (este arquivo): acrescenta os tokens novos e mantém os LEGADOS com os
   valores que já estão em produção. Resultado visual esperado: idêntico.
   Fases 1+ passam a usar os tokens novos; os legados viram aliases dos novos
   quando cada módulo migra, e só são removidos na Fase 6.
   ============================================================================ */

/* ---------- 1. Tema claro (padrão) ---------- */
:root{
  /* superfícies e planos */
  --np-bg:#F3F3F1;           /* papel da área de trabalho */
  --np-side:#ECECE8;         /* lateral (um tom abaixo do papel) */
  --np-surface:#FFFFFF;      /* folha: painel, popover, botões, paleta */
  --np-surface-2:#F6F6F4;    /* avatar, segmento, campos */
  --np-line:#E3E3DF;         /* fio padrão */
  --np-line-2:#D2D2CD;       /* fio forte, bordas de botão */
  --np-ctrl:#858580;         /* borda de controle (check, pontos) ≥ 3:1 */
  /* texto */
  --np-text:#1D2126;
  --np-text-2:#4D545C;
  --np-text-3:#5F666E;       /* ≥ 4,5:1 também sobre --np-side */
  --np-inv:#FFFFFF;          /* texto sobre a tinta */
  /* tinta e estados de seleção */
  --np-ink:#2A2E31;
  --np-ink-2:#3A3F43;
  --np-sel:rgba(42,46,49,.08);
  --np-sel-2:rgba(42,46,49,.14);
  --np-hover:rgba(42,46,49,.05);
  /* semânticas (texto) */
  --np-ok:#1E7A4C;
  --np-att:#93600F;          /* âmbar para texto (4,8:1) */
  --np-att-s:#B7791F;        /* âmbar para régua e marcadores (não-texto) */
  --np-crit:#A3302E;         /* fatal */
  --np-late:#8E2B29;         /* atrasada */
  --np-info:#2F5C8F;         /* compromisso / fazendo */
  /* semânticas (fundo) */
  --np-ok-bg:rgba(30,122,76,.12);
  --np-att-bg:rgba(183,121,31,.14);
  --np-crit-bg:rgba(163,48,46,.12);
  --np-info-bg:rgba(47,92,143,.12);
  /* elevação */
  --np-shadow:0 1px 2px rgba(20,22,24,.06),0 12px 32px -12px rgba(20,22,24,.22);
  --np-focus:0 0 0 2px var(--np-bg),0 0 0 4px var(--np-ink);
  /* tipografia (famílias já existentes no projeto) */
  --np-display:"EB Garamond",Georgia,"Times New Roman",serif;
  --np-ui:"General Sans","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --np-fs-1:12px;   /* kbd, contadores, iniciais — mínimo absoluto */
  --np-fs-2:13px;   /* secundário da linha, meta */
  --np-fs-3:14px;   /* corpo, título da linha, navegação */
  --np-fs-4:15px;   /* título da barra */
  --np-fs-5:15.5px; /* prazo (serifa) */
  --np-fs-6:17px;   /* título do painel */
  --np-fs-7:20px;   /* número do resumo (serifa) */
  /* forma e medidas */
  --np-r:6px;        /* controles */
  --np-r-lg:10px;    /* folhas flutuantes e painel */
  --np-side-w:244px; --np-rail-w:56px; --np-drawer-w:272px;
  --np-panel-w:440px; --np-bar-h:48px; --np-row-h:46px;
  /* movimento (Motion Design System) */
  --np-d1:90ms; --np-d2:160ms; --np-d3:240ms; --np-d4:360ms;
  --np-e-in:cubic-bezier(.2,.7,.2,1);      /* chegada */
  --np-e-out:cubic-bezier(.4,0,1,1);       /* saída */
  --np-e-move:cubic-bezier(.45,0,.2,1);    /* mover */
  --np-e-spring:cubic-bezier(.22,1,.36,1); /* mola */
  --np-slow:1;                             /* multiplicador de revisão (5 = câmera lenta) */
  /* color-scheme claro fica implícito (igual à produção); o escuro declara color-scheme:dark */
}

/* ---------- 2. Tema escuro: preferência individual (pp-tema) ou do sistema ---------- */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --np-bg:#141618; --np-side:#1A1C1F; --np-surface:#1E2124; --np-surface-2:#24282C;
    --np-line:#2B3036; --np-line-2:#3B4147; --np-ctrl:#737B83;
    --np-text:#E8EAEC; --np-text-2:#B3B9BF; --np-text-3:#8F979E; --np-inv:#141618;
    --np-ink:#E8EAEC; --np-ink-2:#D0D4D8;
    --np-sel:rgba(255,255,255,.08); --np-sel-2:rgba(255,255,255,.14); --np-hover:rgba(255,255,255,.05);
    --np-ok:#6CC391; --np-att:#E0B35A; --np-att-s:#E0B35A; --np-crit:#E57F7B; --np-late:#D9716D; --np-info:#86ADE0;
    --np-ok-bg:rgba(108,195,145,.14); --np-att-bg:rgba(224,179,90,.14); --np-crit-bg:rgba(229,127,123,.14); --np-info-bg:rgba(134,173,224,.14);
    --np-shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --np-bg:#141618; --np-side:#1A1C1F; --np-surface:#1E2124; --np-surface-2:#24282C;
  --np-line:#2B3036; --np-line-2:#3B4147; --np-ctrl:#737B83;
  --np-text:#E8EAEC; --np-text-2:#B3B9BF; --np-text-3:#8F979E; --np-inv:#141618;
  --np-ink:#E8EAEC; --np-ink-2:#D0D4D8;
  --np-sel:rgba(255,255,255,.08); --np-sel-2:rgba(255,255,255,.14); --np-hover:rgba(255,255,255,.05);
  --np-ok:#6CC391; --np-att:#E0B35A; --np-att-s:#E0B35A; --np-crit:#E57F7B; --np-late:#D9716D; --np-info:#86ADE0;
  --np-ok-bg:rgba(108,195,145,.14); --np-att-bg:rgba(224,179,90,.14); --np-crit-bg:rgba(229,127,123,.14); --np-info-bg:rgba(134,173,224,.14);
  --np-shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}

/* ---------- 3. Movimento reduzido ---------- */
@media (prefers-reduced-motion:reduce){
  :root{--np-d1:0ms;--np-d2:0ms;--np-d3:80ms;--np-d4:80ms}
}

/* ---------- 4. LEGADOS — valores idênticos aos de produção (Fase 0 não muda nada) ----------
   Hoje definidos em fontes/painel.html; passam a viver aqui para haver um único lugar.
   Quando um módulo migrar (Fases 2–5), seus usos trocam para --np-*. Na Fase 6 estes
   nomes viram aliases (ex.: --muted: var(--np-text-3)) e depois saem. */
:root{
  --navy:#2A2E31; --navy-2:#202426; --navy-3:#3A3F42; --gold:#A69D84; --gold-soft:#EAD8B4;
  --bg:#F7F6F2; --surface:#FFFFFF; --surface-2:#F3F1EC; --line:#E8E6E1;
  --fg:#1A1A18; --muted:#6B6760; --faint:#7D7872;
  --on-dark:#FFFFFF; --on-gold:#1B1A14; --sb-fg:#CFD3CD; --sb-fg-strong:#D9D4C7; --sb-brand:#F3EFE6; --sb-scroll:#4A5054;
  --ok:#1B8245; --warn:#B8860B; --crit:#A23B3B; --info:#2F5C8F;
  --btn-primary:#1B8245; --btn-primary-shadow:rgba(0,0,0,0);
  --ch-a:#2E6F55; --ch-b:#B08A4A; --ch-grid:#E3E6DF;
  --display:"General Sans","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --body:"General Sans","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"EB Garamond",Georgia,"Times New Roman",serif;
  --r:12px; --r-sm:8px; --shadow:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04); --shadow-pop:0 8px 30px rgba(0,0,0,.09);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151412; --surface:#1D1C1A; --surface-2:#262523; --line:#302E2B;
  --fg:#F2F0EB; --muted:#A8A49F; --faint:#8C8882; --gold:#C2B693; --gold-soft:#3E3828; --shadow:0 1px 3px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3); --shadow-pop:0 8px 30px rgba(0,0,0,.5);
  --ok:#4FB577; --warn:#D9B04A; --crit:#D8706B; --info:#7FA7D6; --ch-a:#5EA98A; --ch-b:#C9A35E; --ch-grid:#343A3D; --navy:#141617; --navy-2:#101213; --navy-3:#2A2F32; --btn-primary:#1F8F4C; --btn-primary-shadow:rgba(31,143,76,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#151412; --surface:#1D1C1A; --surface-2:#262523; --line:#302E2B;
  --fg:#F2F0EB; --muted:#A8A49F; --faint:#8C8882; --gold:#C2B693; --gold-soft:#3E3828; --shadow:0 1px 3px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3); --shadow-pop:0 8px 30px rgba(0,0,0,.5);
  --ok:#4FB577; --warn:#D9B04A; --crit:#D8706B; --info:#7FA7D6; --ch-a:#5EA98A; --ch-b:#C9A35E; --ch-grid:#343A3D; --navy:#141617; --navy-2:#101213; --navy-3:#2A2F32; --btn-primary:#1F8F4C; --btn-primary-shadow:rgba(31,143,76,.3); color-scheme:dark }
/* ============================================================================
   Casca V3.1 (Design System — Fase 1). Só vale sob html.np-casca-v3.
   Ativada pela chave localStorage "np-casca" = "v3" (Meu perfil → Navegação).
   A chave só escolhe CSS/render: acesso continua em PP.temAcesso, nas classes
   area-*/*-only e na RLS. Fora da classe, nada aqui se aplica (casca V2 intacta).
   Camadas (z-index): barra 5 · véu da gaveta 9 · lateral 10/30 · menus 30 ·
   flyout 70 · dica 80 · modal (existente) acima.
   ============================================================================ */
html.np-casca-v3{--sbw:var(--np-side-w)}
html.np-casca-v3 .app.np-rail{--sbw:var(--np-rail-w)} /* .np-rail = estado derivado (preferência np-trilho ≥1180, ou 901–1179 sem expansão); mantido pelo casca.js */
html.np-casca-v3 body{font-size:14px}
/* a casca V2 sai do fluxo e da árvore de acessibilidade (JS também põe inert) */
html.np-casca-v3 .sb[data-casca="v2"]{display:none!important}
html.np-casca-v3 #np-side[hidden]{display:none!important}
/* hidden vence qualquer display da casca (itens, grupos, links, dica) */
html.np-casca-v3 :is(#np-side,#np-fly,#np-dica,#np-trilha) [hidden],html.np-casca-v3 :is(#np-side,#np-fly)[hidden],html.np-casca-v3 #np-trilha[hidden]{display:none!important}

/* --np-topo: altura de uma faixa fixa acima da casca (a faixa do espelho /beta/ define 22px no body) */
/* ---------- lateral ---------- */
html.np-casca-v3 #np-side{background:var(--np-side);color:var(--np-text);position:sticky;top:var(--np-topo,0px);height:calc(100vh - var(--np-topo,0px));display:flex;flex-direction:column;border-right:1px solid var(--np-line);min-width:0;overflow:hidden;z-index:10;transition:width calc(var(--np-d4)*var(--np-slow)) var(--np-e-spring)}
html.np-casca-v3 .np-ws{display:flex;align-items:center;gap:9px;padding:14px 12px 10px;min-height:52px}
html.np-casca-v3 .np-ws .np-mono{width:26px;height:26px;border-radius:6px;background:var(--np-ink);color:var(--np-inv);display:grid;place-items:center;font-family:var(--np-display);font-size:13.5px;flex:none}
html.np-casca-v3 .np-ws b{font-weight:600;font-size:13.5px;white-space:nowrap;display:block}
html.np-casca-v3 .np-ws small{display:block;font-size:12px;color:var(--np-text-3);white-space:nowrap;line-height:1.1}
html.np-casca-v3 .np-rot{min-width:0;overflow:hidden;transition:opacity calc(var(--np-d2)*var(--np-slow))}
html.np-casca-v3 .np-acoes{padding:4px 12px 10px}
html.np-casca-v3 .np-busca-btn{display:flex;align-items:center;gap:9px;height:34px;padding:0 10px;border-radius:var(--np-r);background:var(--np-surface);border:1px solid var(--np-line);color:var(--np-text-3);font-size:13.5px;width:100%;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;transition:border-color calc(var(--np-d2)*var(--np-slow)),color calc(var(--np-d2)*var(--np-slow))}
html.np-casca-v3 .np-busca-btn:hover{border-color:var(--np-line-2);color:var(--np-text)}
html.np-casca-v3 .np-busca-btn kbd{margin-left:auto;font:12px var(--np-ui);color:var(--np-text-3);border:1px solid var(--np-line-2);border-radius:4px;padding:0 5px}
html.np-casca-v3 .np-ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
html.np-casca-v3 #np-tree{flex:1;overflow:auto;padding:2px 8px 8px;scrollbar-width:thin;scrollbar-color:var(--np-line-2) transparent;mask-image:linear-gradient(to bottom,transparent 0,#000 10px,#000 calc(100% - 14px),transparent 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 10px,#000 calc(100% - 14px),transparent 100%)}
/* itens: reaproveita .tab gerado por itemNav() (button com svg + span [+ .cnt]) */
html.np-casca-v3 #np-tree .tab{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;border-radius:var(--np-r);border:0;background:transparent;color:var(--np-text-2);font-size:14px;font-weight:400;white-space:nowrap;position:relative;width:100%;text-align:left;cursor:pointer;text-decoration:none;transition:background calc(var(--np-d1)*var(--np-slow)),color calc(var(--np-d1)*var(--np-slow))}
html.np-casca-v3 #np-tree .tab:hover{background:var(--np-hover);color:var(--np-text)}
html.np-casca-v3 #np-tree .tab[aria-current="page"]{background:var(--np-sel);color:var(--np-text);font-weight:500}
html.np-casca-v3 #np-tree .tab[aria-current="page"]::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 2px 2px 0;background:var(--np-ink)}
html.np-casca-v3 #np-tree .tab svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--np-text-3);opacity:1}
html.np-casca-v3 #np-tree .tab[aria-current="page"] svg{color:var(--np-text)}
html.np-casca-v3 #np-tree .tab span{overflow:hidden;text-overflow:ellipsis;transition:opacity calc(var(--np-d2)*var(--np-slow))}
html.np-casca-v3 #np-tree .tab .cnt{margin-left:auto;background:transparent;color:var(--np-text-3);font-size:12px;font-weight:500;padding:0;border-radius:0;font-variant-numeric:tabular-nums}
html.np-casca-v3 #np-tree .np-sec{height:8px}
html.np-casca-v3 #np-tree .np-g{display:flex;flex-direction:column}
html.np-casca-v3 #np-tree .np-g>.np-gh{display:flex;align-items:center;gap:8px;height:28px;margin-top:8px;padding:0 8px 0 10px;border-radius:var(--np-r);border:0;background:transparent;color:var(--np-text-3);font-size:12.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap;width:100%;text-align:left;cursor:pointer;position:relative;transition:background calc(var(--np-d1)*var(--np-slow)),color calc(var(--np-d1)*var(--np-slow))}
html.np-casca-v3 #np-tree .np-g>.np-gh:hover{background:var(--np-hover);color:var(--np-text)}
html.np-casca-v3 #np-tree .np-g.np-ativo>.np-gh{color:var(--np-text-2)}
html.np-casca-v3 #np-tree .np-g>.np-gh .np-chev{width:12px;height:12px;margin-left:-2px;opacity:.8;transition:transform calc(var(--np-d3)*var(--np-slow)) var(--np-e-move)}
html.np-casca-v3 #np-tree .np-g[data-aberto="0"]>.np-gh .np-chev{transform:rotate(-90deg)}
html.np-casca-v3 #np-tree .np-corpo{display:grid;grid-template-rows:1fr;transition:grid-template-rows calc(var(--np-d4)*var(--np-slow)) var(--np-e-move)}
html.np-casca-v3 #np-tree .np-g[data-aberto="0"] .np-corpo{grid-template-rows:0fr}
html.np-casca-v3 #np-tree .np-corpo>ul{overflow:hidden;min-height:0}
html.np-casca-v3 .np-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
html.np-casca-v3 .np-lista>li{display:block;min-width:0}
html.np-casca-v3 #np-tree .np-sub{margin-left:15px;border-left:1px solid var(--np-line-2);padding-left:6px;display:flex;flex-direction:column;gap:1px}
html.np-casca-v3 #np-tree .np-sub .tab{height:30px;font-size:13.5px}
html.np-casca-v3 #np-tree .np-sub .tab[aria-current="page"]{box-shadow:inset 2px 0 0 var(--np-ink)}
html.np-casca-v3 #np-tree .np-sub .tab[aria-current="page"]::before{display:none}
html.np-casca-v3 #np-tree .np-g[data-vazio="1"]{display:none}
html.np-casca-v3 .np-eu{display:flex;align-items:center;gap:9px;padding:8px 8px 10px;border-top:1px solid var(--np-line);font-size:12.5px;white-space:nowrap;overflow:hidden}
html.np-casca-v3 .np-eu .tab{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--np-r);border:0;background:transparent;color:var(--np-text-2);width:100%;text-align:left;cursor:pointer;font:inherit;min-width:0}
html.np-casca-v3 .np-eu .tab:hover{background:var(--np-hover);color:var(--np-text)}
html.np-casca-v3 .np-eu .tab[aria-current="page"]{background:var(--np-sel);color:var(--np-text)}
html.np-casca-v3 .np-eu i{width:26px;height:26px;border-radius:50%;background:var(--np-surface-2);border:1px solid var(--np-line-2);display:grid;place-items:center;font-style:normal;font-weight:600;font-size:12px;flex:none;color:var(--np-text-2)}
html.np-casca-v3 .np-eu b{display:block;font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis}
html.np-casca-v3 .np-eu small{display:block;color:var(--np-text-3);font-size:12px}
html.np-casca-v3 .np-eu .np-links{display:flex;flex-direction:column;gap:1px;padding:0 0 4px}
html.np-casca-v3 .np-eu .np-links a{font-size:12.5px;color:var(--np-text-3);padding:4px 8px;border-radius:var(--np-r);text-decoration:none}
html.np-casca-v3 .np-eu .np-links a:hover{background:var(--np-hover);color:var(--np-text)}

/* ---------- trilho (recolhido) ---------- */
html.np-casca-v3 .np-rail #np-side{overflow:visible}
html.np-casca-v3 .np-rail .np-ws{justify-content:center;padding:14px 0 8px}
html.np-casca-v3 .np-rail .np-rot,html.np-casca-v3 .np-rail #np-tree .tab span,html.np-casca-v3 .np-rail #np-tree .np-gh span,html.np-casca-v3 .np-rail #np-tree .np-gh .np-chev,html.np-casca-v3 .np-rail .np-busca-btn span,html.np-casca-v3 .np-rail .np-busca-btn kbd,html.np-casca-v3 .np-rail .np-eu .np-rot,html.np-casca-v3 .np-rail .np-eu .np-links{display:none}
html.np-casca-v3 .np-rail .np-acoes{padding:4px 10px 10px}
html.np-casca-v3 .np-rail .np-busca-btn{justify-content:center;padding:0;gap:0;width:36px;margin:0 auto}
html.np-casca-v3 .np-rail #np-tree{padding:2px 10px;mask-image:none;-webkit-mask-image:none}

html.np-casca-v3 .np-ciclo::before{content:"";position:absolute;left:10%;right:10%;top:13px;height:1px;background:var(--np-line-2)}
html.np-casca-v3 .np-ciclo li{position:relative;text-align:center;padding:0 2px;color:var(--np-text-3)}
html.np-casca-v3 .np-ciclo .dot{width:26px;height:26px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font:500 var(--np-fs-1)/1 var(--np-ui);background:var(--np-surface);border:1.5px solid var(--np-line-2);color:var(--np-text-3)}
html.np-casca-v3 .np-ciclo .dot .np-ico{width:14px;height:14px}
html.np-casca-v3 .np-ciclo li.ok .dot{background:var(--np-ok);border-color:var(--np-ok);color:#fff}
html.np-casca-v3 .np-ciclo li.atual .dot{border-color:var(--np-ink);color:var(--np-text);box-shadow:0 0 0 3px color-mix(in srgb,var(--np-ink) 18%,transparent)}
html.np-casca-v3 .np-ciclo .l{display:block;font:500 var(--np-fs-1)/1.2 var(--np-ui);margin-top:6px;color:var(--np-text-2)}html.np-casca-v3 .np-ciclo li.atual .l{color:var(--np-text)}
html.np-casca-v3 .np-ciclo .d{display:block;font:500 var(--np-fs-1)/1.2 var(--np-display);color:var(--np-text-3);font-variant-numeric:tabular-nums;margin-top:2px}
html.np-casca-v3 .np-tab-w{overflow-x:auto;max-width:100%}
html.np-casca-v3 .np-tab{width:100%;border-collapse:collapse;font:400 var(--np-fs-2)/1.3 var(--np-ui);color:var(--np-text)}
html.np-casca-v3 .np-tab th{text-align:left;font:500 var(--np-fs-1)/1.2 var(--np-ui);color:var(--np-text-3);padding:4px 8px 6px 0;border-bottom:1px solid var(--np-line);white-space:nowrap}
html.np-casca-v3 .np-tab td{padding:6px 8px 6px 0;border-bottom:1px solid var(--np-line);vertical-align:top}
html.np-casca-v3 .np-tab tr:last-child td{border-bottom:0}
html.np-casca-v3 .np-tab .num{text-align:right;font-family:var(--np-display);font-variant-numeric:tabular-nums;white-space:nowrap}
html.np-casca-v3 .np-tab th.num{font-family:var(--np-ui)}
html.np-casca-v3 .np-tab td.np-sem,html.np-casca-v3 .np-tab .np-sem{color:var(--np-text-3)}
/* módulos renderizados em V3.1 (`.np-v3` na vista): a faixa de abas do hub (V2) sai — a árvore da casca já tem os destinos */
html.np-casca-v3 .np-v3 > .hub-tabs{display:none}
/* celular (≤ 600): a linha vira três faixas — (1) data da reunião/prazo + urgência, (2) título e contexto, (3) marcas · responsável · progresso · valor —
   nenhum elemento divide a largura com outro de função diferente; todas as informações continuam presentes */
@media (max-width:600px){
  html.np-casca-v3 .np-it{grid-template-columns:22px minmax(0,1fr);grid-template-areas:"chk prazo" "chk texto" "chk dir";row-gap:3px}
  html.np-casca-v3 .np-it-prazo{min-height:0}
  html.np-casca-v3 .np-it-dir{grid-area:dir;justify-content:flex-start;flex-wrap:wrap;gap:4px 10px;white-space:nowrap;margin-top:1px}
  html.np-casca-v3 .np-it-dir .np-quem{order:-1}
  html.np-casca-v3 .np-it-dir .np-quem-vazio{font-size:0}html.np-casca-v3 .np-it-dir .np-quem-vazio::before{content:"—";font-size:var(--np-fs-2);color:var(--np-text-3)}
  html.np-casca-v3 .np-it-dir .np-val{margin-left:auto;font-size:var(--np-fs-2)}
  html.np-casca-v3 .np-it-dir .np-val b.de,html.np-casca-v3 .np-it-dir .np-val .seta{display:none}
  html.np-casca-v3 .np-it-prazo .r{white-space:nowrap}
}
/* quadro de etapas (Negociações): sempre uma linha de colunas, com rolagem horizontal — como o kanban V2 */
html.np-casca-v3 .np-quadro-neg{grid-template-columns:repeat(var(--n,7),minmax(200px,1fr));overflow-x:auto;scroll-snap-type:x proximity}html.np-casca-v3 .np-quadro-neg .np-colq{scroll-snap-align:start;min-width:0}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14.5px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--body);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.01em;line-height:1.1} h2{font-size:18px} h3{font-size:15.5px}
.display,h1.display{font-family:var(--display);font-weight:600;letter-spacing:-.02em;font-size:28px}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:lining-nums tabular-nums}

/* ---------- Shell: sidebar + barra superior ---------- */
:root{--sbw:236px}
.app{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:100vh}
.app.colapsada{--sbw:64px}
.sb{background:var(--navy);color:var(--sb-fg-strong);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden auto;border-right:1px solid rgba(255,255,255,.06);scrollbar-width:thin;scrollbar-color:var(--sb-scroll) transparent}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 14px 12px;color:var(--sb-brand);min-height:62px;flex:0 0 auto}
.brand .logo{width:128px;height:auto;display:block}
.brand .mono{display:none;width:24px;height:auto}
.brand small{color:var(--gold);letter-spacing:.16em;text-transform:uppercase;font-size:12px;font-weight:600;display:block;white-space:nowrap}
.sb .tabs{display:flex;flex-direction:column;gap:1px;padding:0 8px 8px;flex:1}
.sb .grp-h{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;padding:12px 8px 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;white-space:nowrap;cursor:pointer;font-family:inherit}
.sb .grp-h:hover{color:var(--sb-fg-strong)}
.sb .grp-h .chev{width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-right:4px;transition:transform .15s}
.sb .grp.fechado .grp-h .chev{transform:rotate(-45deg)}
.sb .grp.fechado .grp-i{display:none}
.sb .grp-i{display:flex;flex-direction:column;gap:1px}
.sb .tab{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;border:0;background:transparent;color:var(--sb-fg);font-weight:500;font-size:14.5px;cursor:pointer;text-align:left;position:relative;white-space:nowrap;width:100%;text-decoration:none}
.sb .tab:hover{background:rgba(255,255,255,.07);color:var(--on-dark)}
.sb .tab[aria-selected="true"]{background:var(--navy-3);color:var(--on-dark)}
.sb .tab[aria-selected="true"]::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--gold)}
.sb .tab svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.sb .tab .cnt{margin-left:auto;background:var(--gold);color:var(--on-gold);font-size:12px;font-weight:700;border-radius:999px;padding:1px 7px}
.sb .fim{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:8px}
.colapsada .brand .logo,.colapsada .brand small,.colapsada .sb .grp-h,.colapsada .sb .tab span{display:none}
.colapsada .brand .mono{display:block}
.colapsada .sb .grp.fechado .grp-i{display:flex}
.colapsada .sb .grp{border-top:1px solid rgba(255,255,255,.08);margin-top:6px;padding-top:6px}
.colapsada .brand{justify-content:center;padding-inline:0}
.colapsada .tab{justify-content:center;padding:10px}
.colapsada .tab .cnt{position:absolute;top:4px;right:4px;padding:0 5px;font-size:12px}
.app-body{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;min-height:58px}
.top .ham{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center}
.top .ham:hover{background:var(--surface-2)}
.top .area{font-size:16px;font-weight:600;white-space:nowrap;letter-spacing:-.01em}
.busca{position:relative;flex:1;max-width:520px}
.busca input{width:100%;padding:8px 14px 8px 36px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);font-size:14px}
.busca>svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:2;pointer-events:none}
.busca .res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.22);z-index:30;overflow:hidden;max-height:min(60vh,440px);overflow-y:auto}
.busca .res .grp-h{padding:8px 12px 4px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
.busca .res button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;border:0;background:transparent;padding:8px 12px;cursor:pointer;text-align:left;color:var(--fg)}
.busca .res button:hover,.busca .res button[aria-selected="true"]{background:var(--surface-2)}
.busca .res button small{color:var(--muted);font-size:12.5px}
.top .sp{flex:1}
.ic{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);cursor:pointer;position:relative;flex:none}
.ic:hover{background:var(--surface-2)}
.ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu{position:relative}
.menu-list{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:220px;z-index:30;flex-direction:column;gap:2px;box-shadow:0 14px 40px rgba(0,0,0,.22)}
.menu.open .menu-list{display:flex}
.menu-list .tab{color:var(--fg)}
.menu-list .tab:hover{background:var(--surface-2);color:var(--fg)}
.wrap .tabs,.modal .tabs{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);padding:3px;border-radius:999px;flex-wrap:wrap;align-self:flex-start}
.wrap .tab,.modal .tab{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:500;font-size:13.5px;font-family:inherit}
.wrap .tab:hover,.modal .tab:hover{color:var(--fg)}
.wrap .tab[aria-selected="true"],.modal .tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-weight:600}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(6,14,28,.5);z-index:9}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sb{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:10;transform:translateX(-100%);transition:transform .18s}
  .app.sb-aberta .sb{transform:none}
  .app.sb-aberta .sb-overlay{display:block}
  .app.colapsada{--sbw:260px}
  .colapsada .brand .logo,.colapsada .brand small,.colapsada .sb .grp-h,.colapsada .sb .tab span{display:revert}
  .colapsada .brand .mono{display:none}
  .colapsada .tab{justify-content:flex-start;padding:8px 10px}
  .top .area{display:none}
}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap;margin-bottom:10px}
.crumbs a,.crumbs button{background:none;border:0;padding:0;color:var(--info);cursor:pointer;font:inherit;font-weight:600}
.crumbs .sep{color:var(--faint)}
.btn-voltar{display:inline-flex}
.crumbs .crumb-cli{display:none}
.switch{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none;white-space:nowrap}
.switch input{accent-color:var(--gold);width:16px;height:16px}

.wrap{max-width:1440px;width:100%;margin:0 auto;padding-block:20px 48px;padding-inline:24px}
@media (max-width:600px){.wrap{padding-inline:14px}}
.grid{display:grid;grid-template-columns:1fr;gap:20px}
.grid>.side{display:none}

/* Sidebar */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:none}
.card .card{box-shadow:none}
.list{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;min-height:48px}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--gold-soft)}
.row .n{font-weight:600}
.row .s{color:var(--muted);font-size:12.5px}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;justify-content:center;line-height:1.3;transition:background .18s ease,border-color .18s ease,transform .12s ease}
.btn:hover{background:var(--surface-2);border-color:#D6D3CC}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--btn-primary);color:var(--on-dark);border-color:var(--btn-primary);box-shadow:none;font-weight:600}.btn.primary:hover{filter:brightness(1.08)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary .seta{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);display:inline-grid;place-items:center;margin-left:-4px}
.btn.primary .seta svg{width:11px;height:11px;stroke:var(--on-dark);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.gold{background:var(--navy);color:var(--on-dark);border-color:var(--navy)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.icon{width:30px;height:30px;padding:0;color:var(--muted)}
.btn.icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hover-acts{display:flex;gap:4px;opacity:0;transition:opacity .12s}
tr:hover .hover-acts,.row:hover .hover-acts,.hover-acts:focus-within{opacity:1}
@media (hover:none){.hover-acts{opacity:1}}
.btn.danger{color:var(--crit)}
.btn:focus-visible,.tab:focus-visible,.row:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button,[role="button"],.row,.tab,.subtab,summary,label[for],a[href]{cursor:pointer}
button:disabled,.btn:disabled,.btn[aria-disabled="true"]{cursor:not-allowed;opacity:.6}
.ico{width:1em;height:1em;display:inline-block;vertical-align:-.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.btn .ico{width:15px;height:15px}
@media (hover:none) and (pointer:coarse){.btn,.tab,.subtab,button:not(.tab):not(.cnt),select,input:not([type="checkbox"]):not([type="radio"]),.row{min-height:44px}.btn.sm{min-height:40px}}

/* Main */
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.eyebrow{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.sub{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:16px 18px}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.kpi .v{font-size:30px;font-weight:500;line-height:1.1;margin-top:8px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .h{font-size:12.5px;color:var(--faint);margin-top:4px}

.section{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

/* Contract cards */
.contracts{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
@media (max-width:420px){.contracts{grid-template-columns:1fr}}
.ct{padding:0;display:flex;flex-direction:column;overflow:hidden}
.ct-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ct-h .bank{font-weight:700;font-size:16px}
.ct-h .prod{color:var(--muted);font-size:13px}
.ct-b{padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.kv .k{font-size:12px;color:var(--muted)}
.kv .v{font-weight:600}
.ct-proj{border-top:1px solid var(--line);padding:12px 16px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.range{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.range .big{font-size:26px;font-weight:600;line-height:1;letter-spacing:-.02em}
.range .mm{color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:4px}
.ct-f{border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.ct-f .acts{display:flex;gap:6px}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.e1{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.e2{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.e3{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.pill.c{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.pill.g{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.conf{font-size:12px;color:var(--muted)}
.conf b{color:var(--fg)}

.spark{width:100%;height:auto;display:block;margin-top:4px}
.spark text{font-family:var(--body);fill:var(--muted)}
.dash{display:grid;grid-template-columns:1fr;gap:16px}
.chart{padding:18px 22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chart svg.wide{max-width:980px}
.chart .donut-wrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.chart .donut-wrap .legend{flex-direction:column;gap:10px;font-size:14px}
.chart h3{font-size:20px}
.chart .sub{font-size:14px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--body);fill:var(--muted);font-size:12px}
.chart .lbl{fill:var(--fg);font-weight:600}
.chart .val{fill:var(--fg);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:var(--navy);color:var(--on-dark);font-size:12.5px;padding:7px 10px;border-radius:6px;z-index:40;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.25);line-height:1.35}
.hit:hover{opacity:.85}
.note{font-size:13px;color:var(--muted)}
.alerta-bem{border:1px solid var(--crit);border-left:4px solid var(--crit);background:color-mix(in srgb,var(--crit) 8%,transparent);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.4;margin-bottom:6px}.alerta-bem b{color:var(--crit);display:block;margin-bottom:3px}
.disclaimer{border-left:3px solid var(--gold);padding:10px 14px;background:var(--surface);font-size:13px;color:var(--muted)}

/* Timeline */
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl li{list-style:none;position:relative;padding:4px 0 12px}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.subtab{background:transparent;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;font:inherit;font-weight:500;font-size:14px;color:var(--muted);margin-bottom:-1px}
.subtab:hover{color:var(--fg)}
.subtab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gold)}

td.r,th.r{text-align:right}

<script>
/* ---------- Runtime Supabase: mesma interface do banco do protótipo (doc/collection/onSnapshot) ---------- */
const SB = window.supabase.createClient("https://ksdwzljfjfucjevdqxvx.supabase.co", "sb_publishable_tt__gxUjGaujzylisID0KQ_qaeaU1-l");
const SB_URL = "https://ksdwzljfjfucjevdqxvx.supabase.co", SB_KEY = "sb_publishable_tt__gxUjGaujzylisID0KQ_qaeaU1-l";
const PP = {perfil:null, listeners:{}, cache:{}};
const TABELAS = {clientes:"clientes", contratos:"contratos", historico:"historico"};
const NOTA_CAMPO = {clientes:"notasInternas", contratos:"notas"};
const FICHA_COLS = ["nome","ativo","endereco","representante","representante_cpf","representante_qualificacao","cpf_titular","tipo_pessoa","nome_fantasia","cidade","uf","segmento","faturamento_mensal","funcionarios","historia","situacao_atual","origem","closer","data_fechamento","data_onboarding","plano","status","negativado","usa_maquininha","tem_consorcio","outros_cnpjs","assuntos_interesse","disponibilidade","observacoes_onboarding","proxima_reuniao","created_at","updated_at","estagio_registrado","etapa_fluxo","tem_divida_atraso","adimplente","possui_processos","projeto_reserva","regua","servico","tipos_dividas","responsavel_onboarding_id","notion_url","direcionamento","direcionamento_em","registrato_ok"];
const equipe = ()=>PP.perfil && (PP.perfil.papel==="admin"||PP.perfil.papel==="colaborador");

async function carregar(col){
  if(col==="historico" && !equipe()){
    const {data,error}=await SB.from("referencias").select("*");
    if(error) throw error;
    // formato compatível com referencias(): divida/valorAcordo sintéticos a partir do desconto
    return data.filter(r=>r.desc!=null).map(r=>({id:r.id,credor:r.credor,grupo:r.grupo,forma:r.forma,status:r.status,data:r.data,divida:1,valorAcordo:1-Number(r.desc)}));
  }
  const {data,error}=await SB.from(TABELAS[col]).select("*").order("id");
  if(error) throw error;
  let notas={};
  if(NOTA_CAMPO[col] && equipe()){
    const {data:ns}=await SB.from("notas_internas").select("id,texto");
    for(const n of (ns||[])) notas[n.id]=n.texto;
  }
  return data.map(r=>{const d={id:r.id,...r.dados};
    if(col==="clientes"){for(const [k,v] of Object.entries(r)){if(!["id","dados","token","acesso_por_token","created_by","updated_by"].includes(k)&&v!=null)d[k]=v}} // colunas da ficha (0008)
    if(col==="contratos"&&r.pasta_numero!=null)d.pasta_numero=r.pasta_numero; // [espelho] pasta do contrato (beta 0005)
    if(NOTA_CAMPO[col]){const n=notas[(col==="clientes"?"cliente:":"contrato:")+r.id];if(n!=null)d[NOTA_CAMPO[col]]=n}return d});
}
async function notificar(col){
  try{const rows=await carregar(col);PP.cache[col]=rows;for(const cb of (PP.listeners[col]||[]))cb({docs:rows.map(r=>({id:r.id,data:()=>r}))})}
  catch(e){console.warn("carregar",col,e);toast("Falha ao carregar "+col)}
}
async function notificarRegras(){
  const {data,error}=await SB.from("regras").select("dados").eq("id","regras").maybeSingle();
  if(error){console.warn(error);return}
  for(const cb of (PP.listeners.regras||[]))cb({exists:!!data,data:()=>data?data.dados:null});
}
function parseRef(p){const [col,id]=p.split("/");return {col,id}}
async function gravar(col,id,doc,{merge=false}={}){
  if(col==="config"){const {error}=await SB.from("regras").upsert({id:"regras",dados:doc});if(error)throw error;return}
  const d={...doc};delete d.id;
  const notaCampo=NOTA_CAMPO[col];let nota=null;
  if(notaCampo){nota=d[notaCampo]??"";delete d[notaCampo]}
  if(merge){const {data:cur}=await SB.from(TABELAS[col]).select("dados").eq("id",id).maybeSingle();Object.assign(d,{...(cur?cur.dados:{}),...d})}
  if(col==="clientes"){for(const k of FICHA_COLS)delete d[k]}   // colunas da ficha não vão para o jsonb
  const row={id,dados:d};if(col==="contratos")row.cliente_id=d.clienteId;if(col==="clientes"&&d.cnpj)row.cnpj=d.cnpj;
  const {error}=await SB.from(TABELAS[col]).upsert(row);if(error)throw error;
  if(notaCampo && !merge){
    const nid=(col==="clientes"?"cliente:":"contrato:")+id;
    const {error:e2}=await SB.from("notas_internas").upsert({id:nid,cliente_id:col==="clientes"?id:d.clienteId,contrato_id:col==="contratos"?id:null,texto:nota||""});
    if(e2)throw e2;
  }
}
const novoId=(col)=>col.slice(0,3)+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
window.__PP_RUNTIME={use:async(n)=>{
  if(n==="db")return {
    doc:(p)=>{const {col,id}=parseRef(p);return {
      onSnapshot:(cb)=>{if(col==="config"){(PP.listeners.regras??=[]).push(cb);notificarRegras()}},
      set:async(doc)=>{await gravar(col,id,doc);await notificar(col)},
      update:async(partial)=>{await gravar(col,id,partial,{merge:true});await notificar(col)},
      delete:async()=>{const {error}=await SB.from(col==="config"?"regras":TABELAS[col]).delete().eq("id",id);if(error)throw error;await notificar(col)}
    }},
    collection:(col)=>({
      onSnapshot:(cb)=>{(PP.listeners[col]??=[]).push(cb);notificar(col)},
      add:async(doc)=>{const id=novoId(col);await gravar(col,id,doc);await notificar(col);return {id}}
    })
  };
  if(n==="user")return {can:async()=>equipe(),id:async()=>PP.perfil?.id||null};
  return null;
}};
/* tempo real: quando algo muda no banco, recarrega a coleção afetada */
function ligarTempoReal(){
  const mapa={clientes:"clientes",contratos:"contratos",historico:"historico",notas_internas:null,regras:"regras",perfis:"perfis"};
  const ch=SB.channel("painel");
  for(const t of Object.keys(mapa)){
    ch.on("postgres_changes",{event:"*",schema:"public",table:t},()=>{
      if(t==="regras")notificarRegras();
      else if(t==="notas_internas"){notificar("clientes");notificar("contratos")}
      else if(t==="perfis"){if(typeof renderUsuarios==="function"&&S.tab==="usuarios")renderUsuarios()}
      else notificar(mapa[t]);
    });
  }
  ch.subscribe();
}
/* ---------- Login e perfil ---------- */
window.__PP_LOGIN = new Promise(resolve=>{
  const show=(v)=>{document.querySelector("#login").hidden=!v};
  async function entrar(){
    const email=document.querySelector("#l-email").value.trim(), senha=document.querySelector("#l-senha").value;
    document.querySelector("#l-err").textContent="";
    const {error}=await SB.auth.signInWithPassword({email,password:senha});
    if(error){document.querySelector("#l-err").textContent="E-mail ou senha incorretos.";return}
  }
  document.querySelector("#l-btn").onclick=entrar;
  document.querySelector("#l-senha").onkeydown=e=>{if(e.key==="Enter")entrar()};
  document.querySelector("#btnSair").onclick=async()=>{await SB.auth.signOut();location.reload()};
  let iniciado=false;
  SB.auth.onAuthStateChange(async(ev,session)=>{
    if(!session){show(true);return}
    if(iniciado)return;iniciado=true;
    const {data:perfil}=await SB.from("perfis").select("*").eq("id",session.user.id).maybeSingle();
    PP.perfil=perfil||{id:session.user.id,papel:"pendente"};
    document.querySelector("#userbox").hidden=false;document.querySelector("#userName").textContent=perfil?.nome||session.user.email;
    show(false);
    if(PP.perfil.papel==="pendente"){
      document.body.classList.add("modo-cliente");
      document.querySelector("#main").innerHTML='<div class="card pendente"><h2>Acesso em análise</h2><div>Seu usuário foi criado, mas ainda não recebeu um perfil. Peça ao administrador do escritório para liberar o acesso.</div></div>';
      document.querySelector("#clientList").innerHTML="";
      return; // não resolve: nada carrega
    }
    if(PP.perfil.papel==="cliente"){document.body.classList.add("modo-cliente");S.clientView=true;S.sel=PP.perfil.cliente_id;S.tab="clientes"}
    if(PP.perfil.papel!=="admin")document.body.classList.add("nao-admin");
    PP.podeGrowth=PP.perfil.papel==="admin"||(PP.perfil.acessos||[]).includes("growth");if(!PP.podeGrowth)document.body.classList.add("sem-growth");
    PP.podeFinanceiro=PP.perfil.papel==="admin"||(PP.perfil.acessos||[]).includes("financeiro");if(!PP.podeFinanceiro)document.body.classList.add("sem-financeiro");
    PP.AREAS=["clientes","juridico","comercial","marketing","financeiro","equipe","growth","atendimento","superendividamento"];PP.TAB_AREA={clientes:"clientes",acompanhamento:"clientes",atendimento:"atendimento",historico:"juridico",regras:"admin",calibracao:"admin",processos:"juridico",negociacoes:"juridico",revisional:"juridico",superendividamento:"superendividamento",pecas:"juridico",monitoramento:"juridico",publicacoes:"controle",autenticador:"juridico",leads:"comercial",automacoes:"comercial",comercial:"comercial",marketing:"marketing",financeiro:"financeiro",estoque:"financeiro",inventario:"financeiro",faturamento:"financeiro",equipe:"equipe",horas:"equipe",growth:"growth",visao:"admin",usuarios:"admin",espelho:"admin","importar-advbox":"admin",requisicoes:"equipe","config-gestao":"equipe"};
    PP.escopoTarefas=()=>PP.perfil.papel==="admin"?{tudo:true}:(PP.perfil.acessos||[]).includes("tarefas_equipe")?{tudo:false,nucleos:["juridico","acordos","acompanhamento_pj"]}:{tudo:false,nucleos:null};

<script>
/* ---------- Tabelas regulatórias ---------- */
// Res. BCB 352/2023, Anexo I (ativos inadimplidos, >90 dias): provisão = A + B × meses desde o inadimplemento, teto 100%.
// Coeficientes coincidem com os fatores A e B da Lei 14.467/2022, art. 3º.
const CARTEIRAS = {
  C1:{A:0.055,B:0.045,nome:"C1 — Alienação fiduciária de imóvel, garantia da União, fundo garantidor (FGO/FGI)"},
  C2:{A:0.30, B:0.034,nome:"C2 — Leasing, hipoteca, penhor, alienação fiduciária de bem móvel, depósito, fiança bancária, seguro de crédito"},

  C4:{A:0.35, B:0.045,nome:"C4 — Capital de giro, ACC/ACE, debêntures sem garantia; rural investimento sem garantia"},

};

const ANEXO2 = [
  {max:14,  p:{C1:.014,C2:.014,C3:.019,C4:.019,C5:.019}},
  {max:30,  p:{C1:.035,C2:.035,C3:.035,C4:.035,C5:.075}},
  {max:60,  p:{C1:.045,C2:.06, C3:.13, C4:.13, C5:.15}},
  {max:90,  p:{C1:.05, C2:.17, C3:.32, C4:.32, C5:.38}},
];
const PRODUTOS = {
  giro:"Capital de giro", cheque:"Cheque especial", contagar:"Conta garantida", cartao:"Cartão de crédito / corporativo",
  receb:"Antecipação de recebíveis / desconto", pronampe:"PRONAMPE / FGO / FGI", rural_custeio:"Crédito rural — custeio",
  rural_invest:"Crédito rural — investimento", veiculo:"Financiamento de veículo / máquina", imovel:"Financiamento imobiliário",
  leasing:"Leasing", ccb:"CCB / empréstimo simples", outro:"Outro"
};
const GARANTIAS = {
  nenhuma:"Sem garantia", aval:"Aval / fiança de sócio ou terceiro", recebiveis:"Cessão fiduciária de recebíveis",
  real_movel:"Alienação fiduciária / penhor de bem móvel", hipoteca:"Hipoteca", real_imovel:"Alienação fiduciária de imóvel",
  fundo:"Fundo garantidor (FGO / FGI)", fianca_bancaria:"Fiança bancária / seguro de crédito"
};
const SITUACOES = {
  emdia:"Em dia", cobranca:"Cobrança administrativa", negativado:"Negativado / protestado", ajuizado:"Ajuizado (execução / monitória)",
  prejuizo:"Baixado a prejuízo", cedido:"Cedido a FIDC / securitizadora", acordo:"Acordo em andamento", quitado:"Quitado"
};

function carteiraAuto(produto, garantia){
  if(garantia==="fundo"||garantia==="real_imovel"||produto==="pronampe"||produto==="imovel") return "C1";
  if(garantia==="real_movel"||garantia==="hipoteca"||garantia==="fianca_bancaria"||produto==="leasing"||produto==="veiculo") return "C2";
  if(garantia==="recebiveis"||produto==="receb"||garantia==="aval") return "C3";
  if(produto==="giro"||produto==="rural_invest") return "C4";
  return "C5";
}

/* ---------- Grupos de credor (comportamento observado) ---------- */
const GRUPOS = {varejo:"Banco de varejo",cooperativa:"Cooperativa de crédito",fidc:"FIDC / securitizadora",digital:"Banco digital / fintech",outro:"Outro"};
const FASES = {administrativa:"Cobrança administrativa",ajuizado:"Ajuizado",execucao:"Execução / cumprimento de sentença",cedido:"Cedido a FIDC"};
const FORMAS = {avista:"À vista",parcelado:"Parcelado"};
const TITULARES = {PJ:"Pessoa jurídica",PF:"Pessoa física (sócio)"};
function grupoBanco(nome){
  const n=(nome||"").toLowerCase();
  if(/sicoob|sicredi|cresol|unicred|ailos|coopera|credi/.test(n))return "cooperativa";
  if(/fidc|ativos|securitiz|recovery|ipanema|kobe|hoepers/.test(n))return "fidc";
  if(/nubank|inter|c6|picpay|neon|mercado pago|stone|infinite|will|original|pag/.test(n))return "digital";
  if(/ita[uú]|bradesco|santander|aymor|caixa|brasil|bb|safra|btg|banrisul|bnb|nordeste|amaz[oô]nia|votorantim|bv|pan|daycoval|abc|sofisa/.test(n))return "varejo";
  return "outro";
}
const normBanco=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").split(/[\s(]/)[0];

/* ---------- Regras padrão (editáveis na aba Regras) ---------- */
const REGRAS_PADRAO = {
  minDiasAtraso:180,          // só projetar acordo a partir de 6 meses de atraso
  usarHistorico:true,         // base primária = acordos reais; provisão vira contexto
  minRefs:2,                  // mínimo de acordos do mesmo credor para usar a mediana dele
  descontoBase:-15,           // fallback regulatório: desconto = provisão − 15 p.p. (quando não há histórico)
  amplitude:10,               // faixa = provável ± 10 p.p. quando há poucas referências
  fatorParcelado:-15,         // cenário parcelado = à vista − 15 p.p. (quando não há referência parcelada)
  tetoDesconto:97,
  margemReserva:10,           // reserva mensal = valor alvo × (1+10%) / meses
  prazoReservaPadrao:6,       // usado só quando não há data de início do atraso (senão o prazo é automático: até a janela típica de acordo)
  janelaMesesPrivado:6,       // bancos privados: janela típica de proposta ~6 meses de atraso
  janelaMesesPublico:12,      // BB/Caixa/BNB: ~12 meses
  prazoReservaMinimo:3,       // nunca sugerir reserva em menos de 3 meses
  descontoGarantiaReal:15,    // garantia real (alienação fiduciária/hipoteca): projeção conservadora — desconto provável de 15%
  amplitudeGarantiaReal:10,
  diasSemRegistro:15,        // alerta de gestão: cliente sem registro na timeline há mais de X dias
  atualizacaoMensal:1.0,      // % a.m. de atualização do saldo em atraso (juros de mora + correção) para estimar a dívida na data-alvo
  fatoresGarantia:{nenhuma:0,aval:-5,recebiveis:-10,real_movel:"risco",hipoteca:"risco",real_imovel:"risco",fundo:"travar",fianca_bancaria:"travar"},
  fatoresProduto:{giro:0,cheque:0,contagar:0,cartao:0,receb:-5,pronampe:0,rural_custeio:-5,rural_invest:-5,veiculo:0,imovel:0,leasing:0,ccb:0,outro:0},
  fatoresSituacao:{emdia:0,cobranca:0,negativado:0,ajuizado:0,prejuizo:5,cedido:0,acordo:0,quitado:0},
  fatoresTitular:{PJ:-5,PF:0},
  fatoresGrupo:{varejo:0,cooperativa:-25,fidc:0,digital:-5,outro:-10},
  fatoresBanco:{"Itaú":0,"Bradesco":0,"Santander":0,"Banco do Brasil":0,"Caixa":0,"Sicoob":0,"Sicredi":0,"Safra":0,"BTG":0,"Nubank":0,"Inter":0,"C6":0,"PicPay":0}
};

/* ---------- Cálculo ---------- */
const DAY=86400000;
const hoje=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const parseD=s=>{if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmtD=d=>d?d.toLocaleDateString("pt-BR"):"—";
const addDays=(d,n)=>new Date(d.getTime()+n*DAY);
const BRL=v=>(v==null||isNaN(v))?"—":v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const pct=v=>(v==null||isNaN(v))?"—":Math.round(v*100)+"%";
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

function diasAtraso(c, ref=hoje()){const d=parseD(c.dataInicioAtraso);return d?Math.max(0,Math.round((ref-d)/DAY)):0}
function estagio(dias){return dias>90?3:dias>30?2:1}
function provisao(carteira,dias){
  if(dias<=90){const f=ANEXO2.find(x=>dias<=x.max);return f.p[carteira]}
  const k=CARTEIRAS[carteira];const meses=Math.floor((dias-90)/30);
  return Math.min(1,k.A+k.B*meses);
}
function mesesInad(dias){return dias>90?Math.floor((dias-90)/30):0}
const BANCOS_PUBLICOS=["banco","caixa","bnb","basa","banrisul","brb","bndes"];
function bancoPublico(nome){const n=(nome||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");return /banco do brasil|^bb\b|caixa|nordeste|bnb|amazonia|basa|banrisul|brb|bndes|banestes|desenvolve/.test(n)}
// prazo de reserva: manual (campo do contrato) ou automático = meses que faltam até a janela típica de acordo
// (6 meses de atraso em banco privado, 12 em banco público), com mínimo de 3 meses. Sem atraso informado: prazo padrão.
function prazoReserva(c,R,dias){
  if(+c.prazoReservaMeses>0)return +c.prazoReservaMeses;
  if(!c.dataInicioAtraso)return R.prazoReservaPadrao||6;
  const janela=(bancoPublico(c.banco)?R.janelaMesesPublico:R.janelaMesesPrivado)||6;
  const faltam=Math.ceil(Math.max(0,janela*30-(dias||0))/30);
  return Math.max(R.prazoReservaMinimo||3,faltam);
}

/* Referências: histórico de acordos (base do escritório) + acordos fechados nos clientes do painel. */
function referencias(){
  const h=(S.historico||[]).filter(x=>x.status==="fechado"&&x.divida>0).map(x=>({credor:x.credor,grupo:x.grupo||grupoBanco(x.credor),forma:x.forma||"avista",desc:1-x.valorAcordo/x.divida,data:x.data,origem:"historico"}));
  const k=S.contratos.filter(x=>x.acordo&&x.acordo.fechado&&x.acordo.saldoNoAcordo>0).map(x=>({credor:x.banco,grupo:grupoBanco(x.banco),forma:(x.acordo.parcelas||1)>1?"parcelado":"avista",desc:+x.acordo.descontoObtido/100,data:x.acordo.data,origem:"cliente"}));
  return h.concat(k);
}
const mediana=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};
const quartil=(a,q)=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const i=(s.length-1)*q;const lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)};

function projetar(c,R,refsAll,ref=hoje()){
  const dias=diasAtraso(c,ref);
  const cart=c.carteiraOverride||carteiraAuto(c.produto,c.garantia);
  const prov=provisao(cart,dias);
  const est=estagio(dias);
  const fg0=R.fatoresGarantia[c.garantia]??0;
  const riscoBem=fg0==="risco";           // garantia real: bem alienado/hipotecado — risco de perda, desconto baixo
  const fg=(typeof fg0==="number")?fg0:0;
  const travado=fg0==="travar";
  const abertura=parseD(c.dataInicioAtraso)?addDays(parseD(c.dataInicioAtraso),R.minDiasAtraso):null;
  const janelaAberta=dias>=R.minDiasAtraso;
  const grupo=grupoBanco(c.banco);
  const nb=normBanco(c.banco);
  const refsBanco=refsAll.filter(r=>normBanco(r.credor)===nb);
  const refsGrupo=refsAll.filter(r=>r.grupo===grupo);
  let faixa=null,base=null;
  if(!travado){
    const teto=R.tetoDesconto/100;
    const ajusteComum=((fg||0)+(R.fatoresProduto[c.produto]??0)+(R.fatoresSituacao[c.situacao]??0)+(R.fatoresTitular[c.titular||"PJ"]??0)+(R.fatoresBanco[c.banco]??0))/100;
    // equivalente à vista: acordos parcelados entram convertidos (desconto − fatorParcelado), para não desperdiçar referência
    const eqAV=r=>r.forma==="parcelado"?r.desc-R.fatorParcelado/100:r.desc;
    const av=refsBanco.map(eqAV), pa=refsBanco.filter(r=>r.forma==="parcelado").map(r=>r.desc);
    const avG=refsGrupo.map(eqAV), paG=refsGrupo.filter(r=>r.forma==="parcelado").map(r=>r.desc);
    let avista,parcelado,fonte,pool;
    if(R.usarHistorico&&av.length>=R.minRefs){avista=mediana(av)+ajusteComum;fonte="banco";pool=av;}
    else if(R.usarHistorico&&avG.length>=R.minRefs){avista=mediana(avG)+ajusteComum;fonte="grupo";pool=avG;}
    else{avista=prov+(R.descontoBase+(R.fatoresGrupo[grupo]??0))/100+ajusteComum;fonte="provisao";pool=[];}
    if(R.usarHistorico&&pa.length>=1&&fonte==="banco")parcelado=mediana(pa)+ajusteComum;
    else if(R.usarHistorico&&paG.length>=R.minRefs&&fonte!=="provisao")parcelado=mediana(paG)+ajusteComum;
    else parcelado=avista+R.fatorParcelado/100;
    avista=clamp(avista,0,teto);parcelado=clamp(parcelado,0,teto);
    const min=pool.length>=3?clamp(quartil(pool,.25)+ajusteComum,0,teto):clamp(avista-R.amplitude/100,0,teto);
    const max=pool.length>=3?clamp(quartil(pool,.75)+ajusteComum,0,teto):clamp(avista+R.amplitude/100,0,teto);
    faixa={min:Math.min(min,avista),provavel:avista,max:Math.max(max,avista),parcelado};
    base={fonte,n:pool.length,mediana:pool.length?mediana(pool):null};
    if(riscoBem){ // garantia real: ignora mediana/provisão e usa a faixa conservadora das regras
      const pv=clamp((R.descontoGarantiaReal??15)/100,0,teto),am=(R.amplitudeGarantiaReal??10)/100;
      faixa={min:clamp(pv-am,0,teto),provavel:pv,max:clamp(pv+am,0,teto),parcelado:clamp(pv+R.fatorParcelado/100,0,teto)};
      base={fonte:"garantia_real",n:0,mediana:null};
    }
  }
  const saldo=+c.saldoAtual||+c.valorOriginal||0;
  const meses=prazoReserva(c,R,dias);
  // Cenário na data-alvo (hoje + prazo de reserva): saldo atualizado e provisão do banco nessa data
  const dataAlvo=new Date(ref);dataAlvo.setMonth(dataAlvo.getMonth()+meses);
  const diasAlvo=c.dataInicioAtraso?dias+meses*30:0;
  const provAlvo=provisao(cart,diasAlvo);
  const taxa=(c.atualizacaoMensal!=null&&c.atualizacaoMensal!==""?+c.atualizacaoMensal:R.atualizacaoMensal)/100;
  const saldoAlvo=c.dataInicioAtraso?saldo*Math.pow(1+taxa,meses):saldo;
  if(faixa&&base.fonte==="provisao"&&!riscoBem){ // base regulatória: refaz a faixa com a provisão da data-alvo
    const teto=R.tetoDesconto/100;const ajusteComum=((fg||0)+(R.fatoresProduto[c.produto]??0)+(R.fatoresSituacao[c.situacao]??0)+(R.fatoresTitular[c.titular||"PJ"]??0)+(R.fatoresBanco[c.banco]??0))/100;
    const av=clamp(provAlvo+(R.descontoBase+(R.fatoresGrupo[grupo]??0))/100+ajusteComum,0,teto);
    faixa={min:clamp(av-R.amplitude/100,0,teto),provavel:av,max:clamp(av+R.amplitude/100,0,teto),parcelado:clamp(av+R.fatorParcelado/100,0,teto)};
  }
  const valorAcordo=faixa?saldoAlvo*(1-faixa.provavel):null;      // acordo à vista na data-alvo
  const valorParcelado=faixa?saldoAlvo*(1-faixa.parcelado):null;
  const valorAcordoHoje=faixa?saldo*(1-faixa.provavel):null;
  const janelaNoPrazo=diasAlvo>=R.minDiasAtraso;
  const reservaMensal=valorAcordo!=null?valorAcordo*(1+R.margemReserva/100)/meses:null;
  const nSim=refsBanco.length;
  const conf=nSim>=5?"alta":nSim>=2?"média":refsGrupo.length>=5?"média":"baixa";
  return {dias,cart,prov,est,travado,riscoBem,janelaAberta,abertura,faixa,base,grupo,saldo,saldoAlvo,dataAlvo,diasAlvo,provAlvo,janelaNoPrazo,valorAcordo,valorAcordoHoje,valorParcelado,meses,reservaMensal,conf,nSim,nGrupo:refsGrupo.length};
}
function curva(c,cart,mesesAFrente=18){
  const d0=parseD(c.dataInicioAtraso);if(!d0)return [];
  const out=[];for(let m=0;m<=mesesAFrente;m++){const ref=new Date(hoje());ref.setMonth(ref.getMonth()+m);out.push(provisao(cart,Math.max(0,Math.round((ref-d0)/DAY))))}
  return out;
}
