<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal — Neves Pádua Advocacia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#0C1F38; --gold:#B8964A; --gold-soft:#E7DCC2;
  --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#EFEBE2; --line:#D9D3C6;
  --fg:#1B2433; --muted:#5E6878; --faint:#8A93A3; --crit:#A23B3B;
  --display:"Cormorant Garamond",Georgia,serif; --body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif; --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1626; --surface:#122238; --surface-2:#182C47; --line:#27405F; --fg:#E9E4D8; --muted:#A9B2C2; --faint:#7D889B; --gold-soft:#3E3522; --crit:#D8706B; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0B1626; --surface:#122238; --surface-2:#182C47; --line:#27405F; --fg:#E9E4D8; --muted:#A9B2C2; --faint:#7D889B; --gold-soft:#3E3522; --crit:#D8706B; color-scheme:dark }
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.005em}
.top{background:var(--navy);color:#F3EFE6;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.1}
.brand small{color:#C9B98C;letter-spacing:.12em;text-transform:uppercase;font-size:10.5px;font-weight:600}
.userbox{margin-left:auto;display:flex;align-items:center;gap:10px;color:#D7D2C6;font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:var(--r);cursor:pointer;font:inherit;font-weight:600;font-size:14px;color:inherit}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);width:100%;padding:11px}
.userbox .btn{background:transparent;color:#D7D2C6;border-color:#3B5074;padding:5px 10px;font-size:13px}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 48px}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--gold);font-weight:700}
.sub{color:var(--muted);margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:22px}
.tile{display:flex;flex-direction:column;gap:8px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:inherit;min-height:140px;transition:background .12s,border-color .12s}
.tile:hover{background:var(--surface-2);border-color:var(--gold)}
.tile h3{font-size:21px}
.tile p{margin:0;color:var(--muted);font-size:14px;flex:1}
.tile .go{color:var(--gold);font-weight:700;font-size:13px;letter-spacing:.04em}
.tile.ext .go::after{content:" ↗"}
.area{margin-top:26px}.area h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-family:var(--body);font-weight:700}
.area .tiles{margin-top:10px}
.tile.destaque{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--surface))}
.tile.breve{opacity:.55;cursor:default}.tile.breve:hover{background:var(--surface);border-color:var(--line)}
.sec{margin-top:30px}
.sec h2{font-size:18px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-family:var(--body);font-size:12px}
.login{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.login .card{width:min(420px,100%);padding:28px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:26px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.f input{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font:inherit;color:inherit;width:100%}
.err{color:var(--crit);font-size:13px;min-height:18px}
.note{font-size:13px;color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--fg);margin-bottom:8px;font-size:24px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="login" id="login">
  <div class="card">
    <div class="eyebrow">Neves Pádua Advocacia</div>
    <h1>Portal</h1>
    <div class="f"><label for="l-email">E-mail</label><input id="l-email" type="email" autocomplete="username"></div>
    <div class="f"><label for="l-senha">Senha</label><input id="l-senha" type="password" autocomplete="current-password"></div>
    <div class="err" id="l-err"></div>
    <button class="btn primary" id="l-btn">Entrar</button>
    <div class="note">Acesso restrito à equipe do escritório e aos clientes convidados. Esqueceu a senha? Fale com o escritório.</div>
  </div>
</div>

<header class="top">
  <div class="brand"><small>Neves Pádua Advocacia</small><b>Portal</b></div>
  <div class="userbox" id="userbox" hidden><span id="userName"></span><button class="btn" id="btnSair">Sair</button></div>
</header>

<main class="wrap" id="main"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB = window.supabase.createClient("https://ksdwzljfjfucjevdqxvx.supabase.co","sb_publishable_tt__gxUjGaujzylisID0KQ_qaeaU1-l");
const $ = s => document.querySelector(s);

/* Módulos do portal. 'papeis' define quem vê o azulejo. Links externos levam ext:true. */
const MODULOS = [
  {area:"Clientes", titulo:"Clientes", desc:"Ficha, fluxo PJ, passivos bancários, reserva, timeline, processos, tarefas e negociações de cada cliente.", href:"passivos/#clientes", papeis:["admin","colaborador"], go:"Abrir", destaque:true},
  {area:"Minha área", titulo:"Minha área", desc:"Situação dos contratos, previsão de acordo, reserva sugerida e andamento do trabalho.", href:"passivos/", papeis:["cliente"], go:"Abrir", destaque:true},
  {area:"Jurídico", titulo:"Tarefas e prazos", desc:"O que vence em 7, 15 e 30 dias, prazos fatais e tarefas por cliente e responsável.", href:"passivos/#tarefas", papeis:["admin","colaborador"], go:"Abrir"},
  {area:"Jurídico", titulo:"Negociações", desc:"Kanban do setor de acordos: da abertura ao acordo concluído, por banco e cliente.", href:"passivos/#negociacoes", papeis:["admin","colaborador"], go:"Abrir"},
  {area:"Jurídico", titulo:"Monitoramento processual", desc:"Checagem periódica dos CPFs/CNPJs de clientes, sócios e avalistas.", href:"passivos/#monitoramento", papeis:["admin","colaborador"], go:"Abrir"},
  {area:"Jurídico", titulo:"Base de acordos", desc:"Como cada credor negocia: histórico de acordos reais do escritório.", href:"passivos/#historico", papeis:["admin","colaborador"], go:"Abrir"},
  {area:"Jurídico", titulo:"Regras de projeção", desc:"Parâmetros do motor de projeção e tabela regulatória.", href:"passivos/#regras", papeis:["admin"], go:"Abrir"},
  {area:"Equipe", titulo:"Colaboradores", desc:"Quem é quem, núcleos, admissão e vínculo com o usuário de cada um.", href:"passivos/#equipe", papeis:["admin","colaborador"], go:"Abrir"},
  {area:"Equipe", titulo:"Horas", desc:"Lance suas horas e acompanhe o timesheet por colaborador, cliente e atividade.", href:"passivos/#horas", papeis:["admin","colaborador"], go:"Abrir"},
  {area:"Equipe", titulo:"Usuários e acessos", desc:"Definir perfis da equipe e dos clientes.", href:"passivos/#usuarios", papeis:["admin"], go:"Gerenciar"},
  {area:"Gestão", titulo:"Dashboard de gestão", desc:"Carteira, jurídico, equipe e alertas em uma tela. Mesmas views que alimentam o Power BI.", href:"gestao/", papeis:["admin","colaborador"], go:"Abrir"},
  {area:"Em breve", titulo:"Comercial", desc:"Leads, funil e fechamentos — hoje na planilha e no CRM.", papeis:["admin","colaborador"], breve:true},
  {area:"Em breve", titulo:"Marketing", desc:"Campanhas, conteúdo e indicadores de tráfego.", papeis:["admin","colaborador"], breve:true},
  {area:"Em breve", titulo:"Financeiro", desc:"Honorários, cobranças e inadimplência — hoje no ASAAS e na planilha.", papeis:["admin","colaborador"], breve:true},
];

function render(perfil){
  const m=$("#main");m.innerHTML="";
  const papel=perfil.papel;
  const h=document.createElement("div");
  h.innerHTML=`<div class="eyebrow">${papel==="cliente"?"Área do cliente":"Área do escritório"}</div><h1>Olá, ${perfil.nome||perfil.email||""}</h1><div class="sub">${papel==="cliente"?"Aqui você acompanha o trabalho do escritório na sua empresa.":"Escolha um sistema para começar."}</div>`;
  m.append(h);
  if(papel==="pendente"){m.innerHTML+='<div class="card empty" style="margin-top:22px"><h2>Acesso em análise</h2><div>Seu usuário foi criado, mas ainda não recebeu um perfil. Peça ao administrador do escritório para liberar o acesso.</div></div>';return}
  const mods=MODULOS.filter(x=>x.papeis.includes(papel));
  for(const area of [...new Set(mods.map(x=>x.area))]){
    const sec=document.createElement("section");sec.className="area";
    if(papel!=="cliente"){const h2=document.createElement("h2");h2.textContent=area;sec.append(h2)}
    const tiles=document.createElement("div");tiles.className="tiles";
    for(const mod of mods.filter(x=>x.area===area)){
      const a=document.createElement(mod.breve?"div":"a");a.className="tile"+(mod.ext?" ext":"")+(mod.destaque?" destaque":"")+(mod.breve?" breve":"");if(!mod.breve)a.href=mod.href;if(mod.ext)a.target="_blank";
      a.innerHTML=`<h3></h3><p></p><span class="go"></span>`;
      a.querySelector("h3").textContent=mod.titulo;a.querySelector("p").textContent=mod.desc;a.querySelector(".go").textContent=mod.breve?"Em breve":(mod.go||"Abrir");
      tiles.append(a);
    }
    sec.append(tiles);m.append(sec);
  }
}

async function entrar(){
  $("#l-err").textContent="";
  const {error}=await SB.auth.signInWithPassword({email:$("#l-email").value.trim(),password:$("#l-senha").value});
  if(error)$("#l-err").textContent="E-mail ou senha incorretos.";
}
$("#l-btn").onclick=entrar;$("#l-senha").onkeydown=e=>{if(e.key==="Enter")entrar()};
$("#btnSair").onclick=async()=>{await SB.auth.signOut();location.reload()};

let iniciado=false;
SB.auth.onAuthStateChange(async(ev,session)=>{
  if(!session){$("#login").hidden=false;return}
  if(iniciado)return;iniciado=true;
  const {data:perfil}=await SB.from("perfis").select("*").eq("id",session.user.id).maybeSingle();
  const p=perfil||{id:session.user.id,papel:"pendente",email:session.user.email};
  $("#userbox").hidden=false;$("#userName").textContent=p.nome||p.email||session.user.email;
  $("#login").hidden=true;
  render(p);
});
</script>
</body>
</html>
